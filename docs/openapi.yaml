        platform role name if they're a platform member, else "seller" if they have any seller
        membership, else "user".
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Case-insensitive substring match on name or email.
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: Paginated user directory listing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
