  responses:
    Unauthorized:
      description: Missing or invalid Bearer token.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
            example:
              error: No token provided
    Forbidden:
      description: Authenticated but insufficient role or account not approved.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error: Insufficient platform permissions
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: The request conflicts with existing state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    BadRequest:
      description: Validation failure or a business rule violation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: An unexpected server-side error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error: Internal server error
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying.
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          schema:
            type: integer
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error:
                type: string
              retryAfter:
                type: integer
          example:
            success: false
            error: Too many requests - please try again later
            retryAfter: 45

paths:
  /health:
    get:
      tags: [Auth]
      summary: Health check
      security: []
      description: Returns server uptime and environment. No authentication required.
      responses:
        "200":
          description: Server is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  uptime:
                    type: number
                    example: 3612.5
                  timestamp:
                    type: string
                    format: date-time
                  environment:
                    type: string
                    example: production

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login
      security: []
      description: |
        Authenticates a user with email and password. Returns a short-lived access token
        and a long-lived refresh token. Both sellers and platform admins use this endpoint.

        Rate limit: 10 requests per minute per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: seller@example.com
                password:
                  type: string
                  format: password
                  minLength: 6
                  example: secret123
      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  accessToken:
                    type: string
                    description: JWT access token. Short-lived.
                  refreshToken:
                    type: string
                    description: JWT refresh token. Valid for 7 days.
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      name:
                        type: string
                        nullable: true
        "401":
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error: Invalid credentials
        "403":
          description: Account is disabled.
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      description: |
        Invalidates the current access token by adding its JTI to a Redis blacklist.
        The token TTL is respected so the blacklist entry expires naturally.
      responses:
        "200":
          description: Logged out successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"
              example:
                success: true
                message: Logged out
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      security: []
      description: |
        Issues a new access token and rotates the refresh token. Pass the refresh token
        in the request body or as the `refreshToken` cookie.

        Rate limit: 10 requests per minute per IP.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Required if not sent as a cookie.
      responses:
        "200":
          description: Tokens refreshed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
        "401":
          description: Missing or invalid refresh token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                example:
                  error: Invalid refresh token

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Current user
      description: |
        Returns the authenticated user's profile. If the user is a seller, the response
        includes the seller's current approval status.
      responses:
        "200":
          description: Current user profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    allOf:
                      - $ref: "#/components/schemas/User"
                      - type: object
                        properties:
                          sellerId:
                            type: string
                            nullable: true
                          role:
                            type: string
                            example: seller
                          status:
                            type: string
                            nullable: true
                            description: Present when the user is a seller.
                          isApproved:
                            type: boolean
                            nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/sellers/register:
    post:
      tags: [Sellers]
      summary: Register as a seller
      security: []
      description: |
        Creates a new seller account. The seller starts in PENDING status and must be
        approved by a platform admin before accessing any protected seller endpoints.

        Rate limit: 100 requests per minute per IP (public limiter).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [
                  name,
                  email,
                  password,
                  phone,
                  businessName,
                  businessType,
                  address,
                ]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: Rahul Mehta
                email:
                  type: string
                  format: email
                  example: rahul@mehtaco.in
                password:
                  type: string
                  format: password
                  minLength: 8
                phone:
                  type: string
                  pattern: '^\+?[6-9]\d{9}$'
                  example: "9876543210"
                businessName:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: Mehta Traders Pvt Ltd
                businessType:
                  $ref: "#/components/schemas/BusinessType"
                address:
                  $ref: "#/components/schemas/Address"
      responses:
        "201":
          description: Seller registered. Awaiting admin approval.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Seller"
        "409":
          description: Email already registered.
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/sellers/invite:
    post:
      tags: [Sellers]
      summary: Invite a seller
      description: |
        Sends an invite to an email address. The invited seller receives a unique token
        to complete registration via POST /api/sellers/invite/accept.

        "Required platform role: super_admin or onboarding_manager."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "201":
          description: Invite sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A seller with this email already exists.
          $ref: "#/components/responses/Conflict"

  /api/sellers/invite/accept:
    post:
      tags: [Sellers]
      summary: Accept a seller invite
      security: []
      description: |
        Completes seller registration using the token from an invite email. The seller
        account is created in PENDING state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [
                  token,
                  name,
                  password,
                  phone,
                  businessName,
                  businessType,
                  address,
                ]
              properties:
                token:
                  type: string
                name:
                  type: string
                  minLength: 2
                password:
                  type: string
                  minLength: 8
                phone:
                  type: string
                  pattern: '^\+?[6-9]\d{9}$'
                businessName:
                  type: string
                businessType:
                  $ref: "#/components/schemas/BusinessType"
                address:
                  $ref: "#/components/schemas/Address"
      responses:
        "201":
          description: Seller account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Invalid, already-used, or expired invite token.
          $ref: "#/components/responses/BadRequest"

  /api/sellers/kyc:
    post:
      tags: [Sellers]
      summary: Submit KYC
      description: |
        Submits KYC documents for the authenticated seller. Can only be submitted once.
        The seller must be in an active (non-suspended, approved) state.

        Required seller role: owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aadharNumber, panNumber]
              properties:
                aadharNumber:
                  type: string
                  pattern: '^\d{12}$'
                  example: "123456789012"
                panNumber:
                  type: string
                  pattern: "^[A-Z]{5}[0-9]{4}[A-Z]$"
                  example: ABCDE1234F
                gstNumber:
                  type: string
                  pattern: '^\d{2}[A-Z]{5}\d{4}[A-Z]{1}[A-Z\d]{1}[Z]{1}[A-Z\d]{1}$'
                  nullable: true
                businessRegNumber:
                  type: string
                  nullable: true
      responses:
        "201":
          description: KYC submitted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/SellerKyc"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: KYC already submitted.
          $ref: "#/components/responses/Conflict"

  /api/sellers/bank:
    post:
      tags: [Sellers]
      summary: Add bank details
      description: "Required seller role: owner."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountHolderName, accountNumber, ifscCode, bankName]
              properties:
                accountHolderName:
                  type: string
                accountNumber:
                  type: string
                  pattern: '^\d{9,18}$'
                ifscCode:
                  type: string
                  pattern: "^[A-Z]{4}0[A-Z0-9]{6}$"
                  example: SBIN0001234
                bankName:
                  type: string
      responses:
        "201":
          description: Bank details saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/SellerBankDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Bank detail already added.
          $ref: "#/components/responses/Conflict"
    get:
      tags: [Sellers]
      summary: Get bank details
      description: "Required seller role: owner."
      responses:
        "200":
          description: Bank details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/SellerBankDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Sellers]
      summary: Update bank details
      description: |
        All fields are optional. Changing the account number or IFSC code re-runs
        bank account verification with the configured provider.

        Required permission: SELLER_BANK.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountHolderName:
                  type: string
                accountNumber:
                  type: string
                  pattern: '^\d{9,18}$'
                ifscCode:
                  type: string
                  pattern: "^[A-Z]{4}0[A-Z0-9]{6}$"
                  example: SBIN0001234
                bankName:
                  type: string
      responses:
        "200":
          description: Bank details updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/SellerBankDetail"
        "400":
          description: Bank detail not found, seller not found, or bank account verification failed.
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/sellers/bank/verify-ifsc:
    post:
      tags: [Sellers]
      summary: Verify an IFSC code
      description: "Looks up bank and branch details for an IFSC code. Required permission: SELLER_BANK."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ifscCode]
              properties:
                ifscCode:
                  type: string
                  pattern: "^[A-Z]{4}0[A-Z0-9]{6}$"
                  example: SBIN0001234
      responses:
        "200":
          description: IFSC lookup result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      verified:
                        type: boolean
                      bankName:
                        type: string
                      branch:
                        type: string
                      message:
                        type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/sellers/members:
    post:
      tags: [Sellers]
      summary: Add a seller team member
      description: |
        Adds an existing platform user to the seller's team with the specified role.

        Required seller role: owner or manager.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, roleId]
              properties:
                email:
                  type: string
                  format: email
                roleId:
                  type: string
      responses:
        "201":
          description: Member added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: User not found, role not found, or user already a member.
          $ref: "#/components/responses/BadRequest"
    get:
      tags: [Sellers]
      summary: List seller team members
      description: "Required permission: SELLER_MEMBERS_VIEW."
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Filter by member name or email (case-insensitive).
        - name: role
          in: query
          schema:
            type: string
          description: Filter by role name.
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Seller team members.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SellerMember"
                  meta:
                    type: object
                    description: Pagination metadata.

  /api/sellers/members/invite:
    post:
      tags: [Sellers]
      summary: Invite a new team member
      description: |
        Invites a user (who may or may not already have a platform account) to join
        the seller's team with the specified role. The invitee accepts via
        POST /api/sellers/invites/accept.

        Required permission: SELLER_MEMBERS_MANAGE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, roleId]
              properties:
                email:
                  type: string
                  format: email
                roleId:
                  type: string
                name:
                  type: string
      responses:
        "201":
          description: Invite created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/TeamInvite"
        "400":
          description: Role not found, user already a member, or invite already pending for this email.
          $ref: "#/components/responses/BadRequest"

  /api/sellers/members/{memberId}:
    delete:
      tags: [Sellers]
      summary: Remove a seller team member
      description: "Required permission: SELLER_MEMBERS_MANAGE."
      parameters:
        - $ref: "#/components/parameters/memberId"
      responses:
        "200":
          description: Member removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Member not found, or cannot remove the owner.
          $ref: "#/components/responses/BadRequest"

  /api/sellers/members/{memberId}/role:
    patch:
      tags: [Sellers]
      summary: Update a seller team member's role
      description: "Required seller role: owner."
      parameters:
        - $ref: "#/components/parameters/memberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId]
              properties:
                roleId:
                  type: string
      responses:
        "200":
          description: Member role updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/sellers/roles:
    get:
      tags: [Sellers]
      summary: List seller roles
      description: "Required permission: SELLER_ROLES_MANAGE."
      responses:
        "200":
          description: Roles defined for the seller, including the default owner/manager/staff roles.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SellerRole"
    post:
      tags: [Sellers]
      summary: Create a custom seller role
      description: "Required permission: SELLER_ROLES_MANAGE."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 30
                description:
                  type: string
      responses:
        "201":
          description: Role created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/SellerRole"
        "400":
          description: A role with this name already exists.
          $ref: "#/components/responses/BadRequest"

  /api/sellers/roles/{roleId}:
    patch:
      tags: [Sellers]
      summary: Update a seller role
      description: |
        Default roles (owner, manager, staff) cannot be modified.

        Required permission: SELLER_ROLES_MANAGE.
      parameters:
        - $ref: "#/components/parameters/roleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 30
                description:
                  type: string
      responses:
        "200":
          description: Role updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/SellerRole"
        "400":
          description: Role not found, or cannot modify default roles.
          $ref: "#/components/responses/BadRequest"
    delete:
      tags: [Sellers]
      summary: Delete a seller role
      description: |
        Default roles cannot be deleted, and a role with active members cannot be deleted.

        Required permission: SELLER_ROLES_MANAGE.
      parameters:
        - $ref: "#/components/parameters/roleId"
      responses:
        "200":
          description: Role deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Role not found, cannot delete default roles, or role has active members.
          $ref: "#/components/responses/BadRequest"

  /api/sellers/roles/{roleId}/permissions:
    get:
      tags: [Sellers]
      summary: List a role's permissions
      description: "Required permission: SELLER_ROLES_MANAGE."
      parameters:
        - $ref: "#/components/parameters/roleId"
      responses:
        "200":
          description: Role with its assigned permissions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      permissions:
                        type: array
                        items:
                          type: object
                          properties:
                            permission:
                              $ref: "#/components/schemas/Permission"
        "400":
          description: Role not found.
          $ref: "#/components/responses/BadRequest"
    put:
      tags: [Sellers]
      summary: Replace a role's permissions
      description: |
        Replaces the full set of permissions assigned to the role. The owner role's
        permissions cannot be modified.

        Required permission: SELLER_ROLES_MANAGE.
      parameters:
        - $ref: "#/components/parameters/roleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                permissions:
                  type: array
                  description: Permission keys to assign to the role (replaces existing assignments).
                  items:
                    type: string
                    example: seller.bank.manage
      responses:
        "200":
          description: Role permissions updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      roleId:
                        type: string
                      permissions:
                        type: array
                        items:
                          type: string
        "400":
          description: Role not found, or cannot modify owner role permissions.
          $ref: "#/components/responses/BadRequest"

  /api/sellers/permissions:
    get:
      tags: [Sellers]
      summary: List all available permissions
      description: "Required permission: SELLER_ROLES_MANAGE."
      responses:
        "200":
          description: All permissions that can be assigned to a role.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Permission"

  /api/sellers/invites:
    get:
      tags: [Sellers]
      summary: List pending team invites
      description: "Required permission: SELLER_INVITES_MANAGE."
      responses:
        "200":
          description: Pending team invites for the seller.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TeamInvite"

  /api/sellers/invites/{inviteId}:
    delete:
      tags: [Sellers]
      summary: Revoke a team invite
      description: "Required permission: SELLER_INVITES_MANAGE."
      parameters:
        - $ref: "#/components/parameters/inviteId"
      responses:
        "200":
          description: Invite revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/TeamInvite"
        "400":
          description: Invite not found, or already used or expired.
          $ref: "#/components/responses/BadRequest"

  /api/sellers/invites/resend:
    post:
      tags: [Sellers]
      summary: Resend a team invite
      description: |
        Extends the invite's expiry by 7 days and re-sends the invite email.

        Required permission: SELLER_INVITES_MANAGE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inviteId]
              properties:
                inviteId:
                  type: string
      responses:
        "200":
          description: Invite resent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/TeamInvite"
        "400":
          description: Invite not found, or already used or expired.
          $ref: "#/components/responses/BadRequest"

  /api/sellers/invites/accept:
    post:
      tags: [Sellers]
      summary: Accept a team invite
      security: []
      description: |
        Completes joining a seller's team using the token from a team invite email.
        If no platform account exists for the invited email, one is created.
        No authentication required — the invitee may not have an account yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, name, password]
              properties:
                token:
                  type: string
                name:
                  type: string
                  minLength: 2
                password:
                  type: string
                  minLength: 8
      responses:
        "201":
          description: Team invite accepted; membership created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                          email:
                            type: string
                            format: email
                      member:
                        $ref: "#/components/schemas/SellerMember"
        "400":
          description: Invalid invite token, invite already used or revoked, or invite expired.
          $ref: "#/components/responses/BadRequest"

  /api/sellers/pending:
    get:
      tags: [Sellers]
      summary: List pending sellers
      description: "Required platform role: super_admin or onboarding_manager."
      responses:
        "200":
          description: List of pending sellers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Seller"

  /api/sellers/all:
    get:
      tags: [Sellers]
      summary: List all sellers
      description: "Required platform role: super_admin or onboarding_manager."
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/SellerStatus"
          description: Filter by seller status.
      responses:
        "200":
          description: List of sellers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Seller"

  /api/sellers/kyc/pending:
    get:
      tags: [Sellers]
      summary: List pending KYC submissions
      description: "Required platform role: super_admin or onboarding_manager."
      responses:
        "200":
          description: Sellers with pending KYC.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /api/sellers/{sellerId}:
    get:
      tags: [Sellers]
      summary: Get seller by ID
      description: "Required platform role: super_admin, onboarding_manager, or product_reviewer."
      parameters:
        - $ref: "#/components/parameters/sellerId"
      responses:
        "200":
          description: Seller record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Seller"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/sellers/{sellerId}/approve:
    patch:
      tags: [Sellers]
      summary: Approve a seller
      description: |
        Transitions the seller from PENDING to APPROVED. A notification is sent to the seller.

        "Required platform role: super_admin or onboarding_manager."
      parameters:
        - $ref: "#/components/parameters/sellerId"
      responses:
        "200":
          description: Seller approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Seller not found or not in PENDING status.
          $ref: "#/components/responses/BadRequest"

  /api/sellers/{sellerId}/reject:
    patch:
      tags: [Sellers]
      summary: Reject a seller
      description: "Required platform role: super_admin or onboarding_manager."
      parameters:
        - $ref: "#/components/parameters/sellerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 5
      responses:
        "200":
          description: Seller rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/sellers/{sellerId}/suspend:
    patch:
      tags: [Sellers]
      summary: Suspend a seller
      description: "Required platform role: super_admin."
      parameters:
        - $ref: "#/components/parameters/sellerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 5
      responses:
        "200":
          description: Seller suspended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/sellers/{sellerId}/reactivate:
    patch:
      tags: [Sellers]
      summary: Reactivate a suspended seller
      description: "Required platform role: super_admin."
      parameters:
        - $ref: "#/components/parameters/sellerId"
      responses:
        "200":
          description: Seller reactivated (status set back to APPROVED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Seller not found, or seller is not suspended.
          $ref: "#/components/responses/BadRequest"

  /api/sellers/{sellerId}/kyc/verify:
    patch:
      tags: [Sellers]
      summary: Verify a seller's KYC
      description: "Required platform role: super_admin or onboarding_manager."
      parameters:
        - $ref: "#/components/parameters/sellerId"
      responses:
        "200":
          description: KYC verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: KYC not found or already verified.
          $ref: "#/components/responses/BadRequest"

  /api/sellers/{sellerId}/kyc/reject:
    patch:
      tags: [Sellers]
      summary: Reject a seller's KYC
      description: "Required platform role: super_admin or onboarding_manager."
      parameters:
        - $ref: "#/components/parameters/sellerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 5
      responses:
        "200":
          description: KYC rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/sellers/{sellerId}/bank/reverify:
    patch:
      tags: [Sellers]
      summary: Re-run bank verification for a seller
      description: |
        Re-submits the seller's existing bank details to the bank verification provider.

        Required platform role: super_admin or onboarding_manager.
      parameters:
        - $ref: "#/components/parameters/sellerId"
      responses:
        "200":
          description: Bank detail reverified.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/SellerBankDetail"
        "400":
          description: Bank detail not found, seller not found, or bank account verification failed.
          $ref: "#/components/responses/BadRequest"

  /api/sellers/{sellerId}/bank/override:
    patch:
      tags: [Sellers]
      summary: Manually override a seller's bank verification status
      description: |
        Sets the bank detail's verification status directly, bypassing the automated
        provider check. Intended for support/ops use when automated verification is
        inconclusive.

        Required platform role: super_admin or onboarding_manager.
      parameters:
        - $ref: "#/components/parameters/sellerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verificationStatus, reason]
              properties:
                verificationStatus:
                  type: string
                  enum: [VERIFIED, NAME_MISMATCH, FAILED]
                reason:
                  type: string
                  minLength: 5
      responses:
        "200":
          description: Bank verification status overridden.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/SellerBankDetail"
        "400":
          description: Bank detail not found.
          $ref: "#/components/responses/BadRequest"

  /api/shops/all:
    get:
      tags: [Shops]
      summary: List all shops (platform admin)
      description: "Required platform role: super_admin."
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Filter by shop name or slug (case-insensitive).
        - name: status
          in: query
          schema:
            type: string
            enum: [active, pending, inactive]
          description: Filter by shop status (active=APPROVED, pending=PENDING, inactive=REJECTED).
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Shops across all sellers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Shop"
                  meta:
                    type: object
                    description: Pagination metadata.

  /api/shops:
    post:
      tags: [Shops]
      summary: Create a shop
      description: |
        Creates a new shop under the authenticated seller's account.
        The seller must be in APPROVED status.

        Required seller role: owner or manager.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - category
                - contactEmail
                - contactPhone
                - pickupStreet
                - pickupCity
                - pickupState
                - pickupPincode
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: Mehta Electronics
                description:
                  type: string
                category:
                  type: string
                  example: Electronics
                logo:
                  type: string
                  format: uri
                banner:
                  type: string
                  format: uri
                contactEmail:
                  type: string
                  format: email
                contactPhone:
                  type: string
                  pattern: '^\+?[6-9]\d{9}$'
                returnPolicy:
                  type: string
                pickupStreet:
                  type: string
                  minLength: 5
                pickupCity:
                  type: string
                pickupState:
                  type: string
                pickupPincode:
                  type: string
                  pattern: '^\d{6}$'
      responses:
        "201":
          description: Shop created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Shop"
        "400":
          description: Seller not found or not approved.
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      tags: [Shops]
      summary: List seller's shops
      description: "Required seller role: owner, manager, or staff."
      responses:
        "200":
          description: Shops belonging to the authenticated seller.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Shop"

  /api/shops/{shopId}:
    get:
      tags: [Shops]
      summary: Get a shop
      description: "Required seller role: owner, manager, or staff."
      parameters:
        - $ref: "#/components/parameters/shopId"
      responses:
        "200":
          description: Shop record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Shop"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Shops]
      summary: Update a shop
      description: |
        All fields are optional. Rejected shops cannot be updated.

        Required seller role: owner or manager.
      parameters:
        - $ref: "#/components/parameters/shopId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                category:
                  type: string
                logo:
                  type: string
                  format: uri
                banner:
                  type: string
                  format: uri
                contactEmail:
                  type: string
                  format: email
                contactPhone:
                  type: string
                returnPolicy:
                  type: string
                pickupStreet:
                  type: string
                pickupCity:
                  type: string
                pickupState:
                  type: string
                pickupPincode:
                  type: string
      responses:
        "200":
          description: Shop updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Shop"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/shops/access/{memberId}:
    put:
      tags: [Shops]
      summary: Set a team member's shop access
      description: |
        Restricts the member to the given list of shops. Members with the owner or
        manager role always have access to all shops and cannot be restricted.

        Required seller role: owner or manager.
      parameters:
        - $ref: "#/components/parameters/memberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shopIds]
              properties:
                shopIds:
                  type: array
                  items:
                    type: string
                  description: CUIDs of shops the member may access. An empty array revokes all shop access.
      responses:
        "200":
          description: Shop access updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    description: The member's resulting shop access grants.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        memberId:
                          type: string
                        shopId:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                        shop:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
        "400":
          description: Member not found, owner/manager roles already have access to all shops, or one or more shops not found.
          $ref: "#/components/responses/BadRequest"
    get:
      tags: [Shops]
      summary: Get a team member's shop access
      description: "Required seller role: owner or manager."
      parameters:
        - $ref: "#/components/parameters/memberId"
      responses:
        "200":
          description: The member's shop access.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      unrestricted:
                        type: boolean
                        description: True if the member's role (owner/manager) grants access to all shops.
                      shops:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
        "404":
          description: Member not found.
          $ref: "#/components/responses/NotFound"

  /api/shops/{shopId}/auto-assign:
    patch:
      tags: [Shops]
      summary: Enable or disable order auto-assignment for a shop
      description: "Required seller role: owner."
      parameters:
        - $ref: "#/components/parameters/shopId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: Auto-assign setting updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Shop"
        "404":
          description: Shop not found.
          $ref: "#/components/responses/NotFound"

  /api/categories:
    get:
      tags: [Categories]
      summary: List categories
      security: []
      description: Returns categories, optionally filtered to direct children of a parent.
      parameters:
        - name: parentId
          in: query
          schema:
            type: string
          description: Return only direct children of this category ID.
      responses:
        "200":
          description: List of categories.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
    post:
      tags: [Categories]
      summary: Create a category
      description: "Required platform role: super_admin."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: Mobile Phones
                description:
                  type: string
                parentId:
                  type: string
                  description: Omit to create a root-level category.
      responses:
        "201":
          description: Category created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Category"
        "400":
          description: Category already exists or parent not found.
          $ref: "#/components/responses/BadRequest"

  /api/categories/tree:
    get:
      tags: [Categories]
      summary: Get full category tree
      security: []
      description: Returns the complete hierarchical category tree.
      responses:
        "200":
          description: Nested category tree.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /api/categories/{categoryId}:
    get:
      tags: [Categories]
      summary: Get a category
      security: []
      parameters:
        - $ref: "#/components/parameters/categoryId"
      responses:
        "200":
          description: Category record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Category"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Categories]
      summary: Update a category
      description: "Required platform role: super_admin."
      parameters:
        - $ref: "#/components/parameters/categoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                parentId:
                  type: string
      responses:
        "200":
          description: Category updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Category"
        "400":
          description: Category not found, parent not found, or circular reference.
          $ref: "#/components/responses/BadRequest"
    delete:
      tags: [Categories]
      summary: Delete a category
      description: |
        Fails if the category has subcategories or associated products.

        Required platform role: super_admin.
      parameters:
        - $ref: "#/components/parameters/categoryId"
      responses:
        "200":
          description: Category deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"
        "400":
          description: Category not found, has subcategories, or has products.
          $ref: "#/components/responses/BadRequest"

  /api/categories/{categoryId}/attributes:
    get:
      tags: [Categories]
      summary: List custom attributes for a category
      security: []
      description: |
        Returns the admin-defined custom field schema for this category, ordered by sortOrder.
        Sellers use this to render the dynamic product-creation form; Product.attributes is
        validated against this schema when a product is created.
      parameters:
        - $ref: "#/components/parameters/categoryId"
      responses:
        "200":
          description: List of category attributes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CategoryAttribute"
        "404":
          description: Category not found.
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Categories]
      summary: Define a custom attribute on a category
      description: "Required platform role: super_admin."
      parameters:
        - $ref: "#/components/parameters/categoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, label, type, required, isVariant, sortOrder]
              properties:
                key:
                  type: string
                  example: ram_gb
                label:
                  type: string
                  example: RAM (GB)
                type:
                  type: string
                  enum: [TEXT, NUMBER, ENUM, BOOLEAN]
                required:
                  type: boolean
                isVariant:
                  type: boolean
                options:
                  type: array
                  items:
                    type: string
                  description: Required when type is ENUM, disallowed otherwise.
                unit:
                  type: string
                sortOrder:
                  type: integer
      responses:
        "201":
          description: Attribute created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/CategoryAttribute"
        "400":
          description: Category not found or attribute key already exists for this category.
          $ref: "#/components/responses/BadRequest"

  /api/categories/{categoryId}/attributes/{attributeId}:
    patch:
      tags: [Categories]
      summary: Update a category attribute
      description: "Required platform role: super_admin."
      parameters:
        - $ref: "#/components/parameters/categoryId"
        - $ref: "#/components/parameters/attributeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                type:
                  type: string
                  enum: [TEXT, NUMBER, ENUM, BOOLEAN]
                required:
                  type: boolean
                isVariant:
                  type: boolean
                options:
                  type: array
                  items:
                    type: string
                unit:
                  type: string
                sortOrder:
                  type: integer
      responses:
        "200":
          description: Attribute updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/CategoryAttribute"
        "400":
          description: |
            Attribute not found, or options is required when type is ENUM,
            or options is only allowed when type is ENUM.
          $ref: "#/components/responses/BadRequest"
    delete:
      tags: [Categories]
      summary: Delete a category attribute
      description: "Required platform role: super_admin."
      parameters:
        - $ref: "#/components/parameters/categoryId"
        - $ref: "#/components/parameters/attributeId"
      responses:
        "200":
          description: Attribute deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"
        "400":
          description: Attribute not found.
          $ref: "#/components/responses/BadRequest"

  /api/products/search:
    get:
      tags: [Products]
      summary: Search products
      security: []
      description: Full-text and filtered product search. Open to the public.
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Search term.
        - name: categoryId
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: sellerId
          in: query
          schema:
            type: string
        - name: shopId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ApprovalStatus"
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated product list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /api/products/bulk/template:
    get:
      tags: [Products]
      summary: Download bulk upload template
      security: []
      description: Returns an XLSX template for bulk product creation.
      responses:
        "200":
          description: XLSX file.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /api/products/bulk:
    post:
      tags: [Products]
      summary: Bulk upload products
      description: |
        Parses an XLSX file and creates multiple products in a single request.
        Seller must have a verified KYC.

        Required seller role: owner or manager.
        Rate limit: upload limiter (20 per minute per seller).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: XLSX file. Max 10 MB.
      responses:
        "201":
          description: Bulk upload processed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      created:
                        type: integer
                      failed:
                        type: integer
                      total:
                        type: integer
                      results:
                        type: array
                        items:
                          type: object
        "400":
          description: Empty file, KYC not verified, or missing columns.
          $ref: "#/components/responses/BadRequest"

  /api/products/pending:
    get:
      tags: [Products]
      summary: List pending products
      description: "Required platform role: super_admin or product_reviewer."
      responses:
        "200":
          description: Products awaiting review.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"

  /api/products:
    post:
      tags: [Products]
      summary: Create a product
      description: |
        Seller KYC must be verified and the target shop must be approved.

        Required seller role: owner or manager.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shopId, name, categoryId]
              properties:
                shopId:
                  type: string
                name:
                  type: string
                  minLength: 2
                  maxLength: 200
                description:
                  type: string
                price:
                  type: number
                  format: double
                compareAtPrice:
                  type: number
                  format: double
                sku:
                  type: string
                stock:
                  type: integer
                  minimum: 0
                  default: 0
                categoryId:
                  type: string
                weightGrams:
                  type: integer
                length:
                  type: number
                width:
                  type: number
                height:
                  type: number
                isDigital:
                  type: boolean
                  default: false
      responses:
        "201":
          description: Product created with PENDING status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Product"
        "400":
          description: Shop not found, shop not approved, duplicate SKU, or KYC issues.
          $ref: "#/components/responses/BadRequest"

  /api/products/shop/{shopId}:
    get:
      tags: [Products]
