  # ---- Wallet ----
  /api/wallet/balance:
    get:
      tags: [Wallet]
      summary: Get the authenticated user's wallet balance
      description: Creates the wallet on first access if it doesn't already exist.
      responses:
        "200":
          description: Current wallet balance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      balance:
                        type: number
                        format: double
                        example: 1500.00
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/wallet/topup:
    post:
      tags: [Wallet]
      summary: Record a wallet top-up
      description: |
        Records a manual bank transfer top-up (NEFT/RTGS/UPI/IMPS with a UTR reference) and credits
        the amount to the wallet balance in the same transaction. The UTR reference must be unique
        across all top-ups.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, method, utrReference]
              properties:
                amount:
                  type: number
                  format: double
                  exclusiveMinimum: 0
                method:
                  type: string
                  enum: [NEFT, RTGS, UPI, IMPS]
                utrReference:
                  type: string
                  minLength: 5
                  maxLength: 50
      responses:
        "201":
          description: Top-up recorded and wallet credited.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      topup:
                        $ref: "#/components/schemas/WalletTopup"
                      wallet:
                        $ref: "#/components/schemas/Wallet"
        "400":
          description: Amount not positive, or this UTR reference has already been used.
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/wallet/transactions:
    get:
      tags: [Wallet]
      summary: List the authenticated user's wallet transactions
      parameters:
        - name: page
          in: query
          schema:
            type: string
            pattern: "^\\d+$"
        - name: limit
          in: query
          schema:
            type: string
            pattern: "^\\d+$"
          description: Capped at 100. Defaults to 20.
      responses:
        "200":
          description: Paginated wallet transaction ledger, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      transactions:
                        type: array
                        items:
                          $ref: "#/components/schemas/WalletTransaction"
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
                      balance:
                        type: number
                        format: double
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/wallet/topups:
    get:
      tags: [Wallet]
      summary: List the authenticated user's top-up history
      responses:
        "200":
          description: All top-ups for the user, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WalletTopup"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---- Wishlist ----
  /api/wishlist:
    get:
      tags: [Wishlist]
      summary: List the authenticated user's wishlist
      description: Includes each item's product (a lightweight select) and SKU, if any.
      responses:
        "200":
          description: Wishlist items, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WishlistItem"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/wishlist/items:
    post:
      tags: [Wishlist]
      summary: Add an item to the wishlist
      description: |
        Idempotent: if the same product/SKU combination is already in the wishlist, the existing
        item is returned rather than duplicated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId:
                  type: string
                skuId:
                  type: string
      responses:
        "201":
          description: Wishlist item (newly created or pre-existing).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/WishlistItem"
        "400":
          description: Product not found, or SKU does not belong to the given product.
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/wishlist/items/{productId}:
    delete:
      tags: [Wishlist]
      summary: Remove an item from the wishlist
      parameters:
        - $ref: "#/components/parameters/productId"
        - name: skuId
          in: query
          schema:
            type: string
          description: If the wishlist item has a specific SKU, it must be supplied to remove it.
      responses:
        "200":
          description: Item removed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          removed:
                            type: boolean
                            example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No matching wishlist item found.
          $ref: "#/components/responses/NotFound"
