openapi: 3.1.0

info:
  title: eTradeBazaar API
  version: 1.0.0
  description: |
    REST API for the eTradeBazaar multi-tenant marketplace platform.

    The platform operates across three actor types: platform administrators,
    sellers (multi-member tenants), and customers. Authentication is JWT-based.
    All protected endpoints require a Bearer token in the Authorization header.

    Base URL: https://api.etradebazaar.com

servers:
  - url: https://api.etradebazaar.com
    description: Production
  - url: https://staging-api.etradebazaar.com
    description: Staging
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Auth
    description: Authentication  login, logout, token refresh, and current user.
  - name: Sellers
    description: Seller registration, onboarding, KYC, bank details, members, and platform admin actions.
  - name: Shops
    description: Seller-scoped shop management.
  - name: Products
    description: Product CRUD, approval workflow, bulk upload, and search.
  - name: Product Images
    description: Image upload, deletion, and reordering for a product.
  - name: Product Variants
    description: Variant options, values, and SKUs for a product.
  - name: Categories
    description: Product category tree management.
  - name: Orders
    description: Order creation, negotiation, address assignment, thresholds, and commissions.
  - name: Payments
    description: Razorpay advance and final payments, verification, refunds, and webhooks.
  - name: Shipments
    description: Shiprocket-backed shipment creation, tracking, cancellation, and serviceability.
  - name: Returns
    description: Customer return requests and seller/admin review.
  - name: Payouts
    description: Seller payout initiation, history, and platform configuration.
  - name: Analytics
    description: Seller and platform-level analytics and materialized view refresh.
  - name: Notifications
    description: In-app notifications with SSE streaming.
  - name: Platform
    description: Platform role and member management, and audit logs.
  - name: Address
    description: Customer saved delivery addresses (address book).
  - name: Cart
    description: Customer shopping cart, line items, and checkout.
  - name: Coupons
    description: Platform admin coupon management and customer-facing coupon validation.
  - name: Customers
    description: Customer registration, profile, phone linking, and order history.
  - name: GST
    description: GSTIN verification and seller KYC autofill.
  - name: Location
    description: Pincode lookup for address autofill and serviceability checks.
  - name: Print Areas
    description: Seller-configured print/design area dimensions for print-on-demand products.
  - name: Reviews
    description: Customer product reviews, seller replies, helpfulness voting, and platform admin moderation.
  - name: Security
    description: Two-factor authentication (TOTP), active session management, and account security summary for the authenticated user.
  - name: Seller Profile
    description: Seller personal profile, business details, verification badges, and per-shop statistics. Distinct from the broader Sellers onboarding/KYC/member endpoints.
  - name: Storefront
    description: |
      Public storefront browsing by shop slug: shop details, product listing, and product detail.

      ⚠ NOT CURRENTLY MOUNTED: this module's router is not registered in src/app.ts as of this writing —
      these endpoints are unreachable until it is wired up.
  - name: Templates
    description: Seller-created design templates for print-on-demand products, with public browsing by product.
  - name: Upload Assets
    description: Generic authenticated file uploads (customer uploads, shop assets, KYC documents) to object storage.
  - name: Users
    description: Platform admin user directory search and listing.
  - name: Verification
    description: |
      Seller Aadhaar and government ID (PAN and others) verification submission, status, and platform admin review.

      ⚠ NOT CURRENTLY MOUNTED: this module's router is not registered in src/app.ts as of this writing —
      these endpoints are unreachable until it is wired up.
  - name: Wallet
    description: Authenticated user platform wallet balance, credit top-ups, and transaction history.
  - name: Wishlist
    description: Customer product wishlist management.

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Obtain a token via POST /api/auth/login. Pass it as:
        Authorization: Bearer <token>

  parameters:
    sellerId:
      name: sellerId
      in: path
      required: true
      schema:
        type: string
      description: CUID of the seller.
    shopId:
      name: shopId
      in: path
      required: true
      schema:
        type: string
      description: CUID of the shop.
    productId:
      name: productId
      in: path
      required: true
      schema:
        type: string
      description: CUID of the product.
    categoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
      description: CUID of the category.
    attributeId:
      name: attributeId
      in: path
      required: true
      schema:
        type: string
      description: CUID of the category attribute.
    orderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
      description: CUID of the order.
    negotiationId:
      name: negotiationId
      in: path
      required: true
      schema:
        type: string
      description: CUID of the negotiation record.
    addressId:
      name: addressId
      in: path
      required: true
      schema:
        type: string
      description: CUID of the order address.
    shipmentId:
      name: shipmentId
      in: path
      required: true
      schema:
        type: string
      description: CUID of the shipment.
    returnId:
      name: returnId
      in: path
      required: true
      schema:
        type: string
      description: CUID of the return request.
    payoutId:
      name: payoutId
      in: path
      required: true
      schema:
        type: string
      description: CUID of the payout.
    memberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
      description: CUID of the member.
    roleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
      description: CUID of the role.
    inviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
      description: CUID of the team invite.
    optionId:
      name: optionId
      in: path
      required: true
      schema:
        type: string
      description: CUID of the variant option.
    valueId:
      name: valueId
      in: path
      required: true
      schema:
        type: string
      description: CUID of the variant option value.
    skuId:
      name: skuId
      in: path
      required: true
      schema:
        type: string
      description: CUID of the product SKU.
    imageId:
      name: imageId
      in: path
      required: true
      schema:
        type: string
      description: CUID of the product image.
    viewName:
      name: viewName
      in: path
      required: true
      schema:
        type: string
        enum:
          - seller_order_stats
          - seller_product_stats
          - seller_daily_revenue
          - platform_daily_stats
          - platform_seller_stats
      description: Name of the materialized view to refresh.
    customerAddressId:
      name: addressId
      in: path
      required: true
      schema:
        type: string
      description: CUID of the customer's saved address (address book entry).
    itemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
      description: CUID of the cart item.
    couponId:
      name: couponId
      in: path
      required: true
      schema:
        type: string
      description: CUID of the coupon.
    reviewId:
      name: reviewId
      in: path
      required: true
      schema:
        type: string
      description: CUID of the review.
    sessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
      description: CUID of the session record.
    shopSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
      description: URL slug of the shop (storefront-facing, distinct from the shop's CUID).
    templateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
      description: CUID of the template.
    assetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
      description: CUID of the uploaded asset.

  schemas:
    SuccessEnvelope:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          example: true
        data:
          description: Present on successful responses that return a payload.

    MessageEnvelope:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Resource deleted.

    ErrorEnvelope:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Resource not found.

    Address:
      type: object
      required:
        - street
        - city
        - state
        - pincode
      properties:
        street:
          type: string
          example: 12, MG Road
        city:
          type: string
          example: Ahmedabad
        state:
          type: string
          example: Gujarat
        pincode:
          type: string
          pattern: '^\d{6}$'
          example: "380001"

    DeliveryAddress:
      allOf:
        - $ref: "#/components/schemas/Address"
        - type: object
          required:
            - receiverName
            - phone
          properties:
            receiverName:
              type: string
              example: Rahul Mehta
            phone:
              type: string
              pattern: '^\+?[6-9]\d{9}$'
              example: "9876543210"
            latitude:
              type: number
              format: double
              example: 23.0225
            longitude:
              type: number
              format: double
              example: 72.5714

    CustomerAddress:
      description: A customer's saved delivery address (address book entry).
      allOf:
        - $ref: "#/components/schemas/DeliveryAddress"
        - type: object
          properties:
            id:
              type: string
              example: clxaddr1234abcd
            userId:
              type: string
            label:
              type: string
              nullable: true
              example: Home
            isDefault:
              type: boolean
              example: true
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    PincodeDetails:
      type: object
      required:
        - pincode
        - city
        - state
      properties:
        pincode:
          type: string
          example: "380001"
        city:
          type: string
          example: Ahmedabad
        state:
          type: string
          example: Gujarat
        district:
          type: string
          nullable: true
        taluka:
          type: string
          nullable: true
        division:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        circle:
          type: string
          nullable: true
        deliveryStatus:
          type: string
          nullable: true
        divisionName:
          type: string
          nullable: true
        regionName:
          type: string
          nullable: true
        circleName:
          type: string
          nullable: true

    GstDetails:
      type: object
      properties:
        gstin:
          type: string
          example: "24AAACT2727Q1ZW"
        legalName:
          type: string
          example: Test Business Pvt Ltd
        tradeName:
          type: string
          example: Test Business
        status:
          type: string
          example: Active
        address:
          type: string
          example: 123 Test Street, Test City, Test State 000000
        registrationDate:
          type: string
          example: 01/01/2020
        businessType:
          type: string
          example: Private Limited Company
        raw:
          description: Raw response payload from the upstream GST verification provider.

    User:
      type: object
      properties:
        id:
          type: string
          example: clxyz1234abcd
        email:
          type: string
          format: email
          example: user@example.com
        name:
          type: string
          nullable: true
          example: Rahul Mehta
        isActive:
          type: boolean
          example: true
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CustomerProfile:
      description: A customer-facing subset of the User record.
      type: object
      properties:
        id:
          type: string
          example: clxyz1234abcd
        name:
          type: string
          nullable: true
          example: Rahul Mehta
        email:
          type: string
          format: email
          example: user@example.com
        phone:
          type: string
          nullable: true
          example: "9876543210"
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Seller:
      type: object
      properties:
        id:
          type: string
          example: clxyz1234abcd
        name:
          type: string
          example: Rahul Mehta
        email:
          type: string
          format: email
          example: seller@example.com
        phone:
          type: string
          example: "9876543210"
        businessName:
          type: string
          example: Mehta Traders Pvt Ltd
        businessType:
          $ref: "#/components/schemas/BusinessType"
        street:
          type: string
        city:
          type: string
        state:
          type: string
        pincode:
          type: string
        status:
          $ref: "#/components/schemas/SellerStatus"
        invitedBy:
          type: string
          nullable: true
        suspendedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Shop:
      type: object
      properties:
        id:
          type: string
        sellerId:
          type: string
        name:
          type: string
          example: Mehta Electronics
        slug:
          type: string
          example: mehta-electronics
        description:
          type: string
          nullable: true
        category:
          type: string
          example: Electronics
        logo:
          type: string
          format: uri
          nullable: true
        banner:
          type: string
          format: uri
          nullable: true
        contactEmail:
          type: string
          format: email
        contactPhone:
          type: string
        returnPolicy:
          type: string
          nullable: true
        pickupStreet:
          type: string
        pickupCity:
          type: string
        pickupState:
          type: string
        pickupPincode:
          type: string
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        status:
          $ref: "#/components/schemas/ApprovalStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Product:
      type: object
      properties:
        id:
          type: string
        shopId:
          type: string
        sellerId:
          type: string
        categoryId:
          type: string
        name:
          type: string
          example: Wireless Bluetooth Headset
        description:
          type: string
          nullable: true
        price:
          type: number
          format: double
          nullable: true
          example: 1299.00
        compareAtPrice:
          type: number
          format: double
          nullable: true
          example: 1599.00
        sku:
          type: string
          nullable: true
          example: SKU-WBH-001
        stock:
          type: integer
          nullable: true
          example: 150
        lowStockThreshold:
          type: integer
          nullable: true
        weightGrams:
          type: integer
          nullable: true
        length:
          type: number
          nullable: true
        width:
          type: number
          nullable: true
        height:
          type: number
          nullable: true
        isDigital:
          type: boolean
          example: false
        status:
          $ref: "#/components/schemas/ApprovalStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProductImage:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        url:
          type: string
          format: uri
        key:
          type: string
        order:
          type: integer
        createdAt:
          type: string
          format: date-time

    VariantOption:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        name:
          type: string
          example: Color
        values:
          type: array
          items:
            $ref: "#/components/schemas/VariantOptionValue"

    VariantOptionValue:
      type: object
      properties:
        id:
          type: string
        optionId:
          type: string
        value:
          type: string
          example: Red

    ProductSKU:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        sku:
          type: string
          example: SKU-WBH-RED-L
        price:
          type: number
          format: double
          example: 1299.00
        stock:
          type: integer
          example: 50
        minQuantity:
          type: integer
          example: 1
        options:
          type: object
          additionalProperties:
            type: string
          description: Key-value map of variant option names to selected values.
          example:
            Color: Red
            Size: L

    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: Electronics
        slug:
          type: string
          example: electronics
        description:
          type: string
          nullable: true
        parentId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CategoryAttribute:
      type: object
      description: |
        Admin-defined custom field on a category. Non-variant attributes (isVariant: false)
        are validated against Product.attributes at product-creation time; variant attributes
        (isVariant: true, e.g. size/color) are instead modeled via VariantOption/ProductSKU.
      properties:
        id:
          type: string
        categoryId:
          type: string
        key:
          type: string
          description: Machine key used as the property name in Product.attributes.
          example: ram_gb
        label:
          type: string
          example: RAM (GB)
        type:
          type: string
          enum: [TEXT, NUMBER, ENUM, BOOLEAN]
        required:
          type: boolean
        isVariant:
          type: boolean
          description: If true, this attribute is a variant axis (e.g. size/color) rather than a plain product spec.
        options:
          type: array
          items:
            type: string
          description: Allowed values. Required when type is ENUM, disallowed otherwise.
        unit:
          type: string
          nullable: true
          example: GB
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Order:
      type: object
      properties:
        id:
          type: string
        sellerId:
          type: string
        customerId:
          type: string
        type:
          $ref: "#/components/schemas/OrderType"
        status:
          $ref: "#/components/schemas/OrderStatus"
        totalAmount:
          type: number
          format: double
          example: 3897.00
        finalAmount:
          type: number
          format: double
          nullable: true
        commissionRate:
          type: number
          format: double
          nullable: true
        commissionAmount:
          type: number
          format: double
          nullable: true
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"
        assignedShopId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrderItem:
      type: object
      properties:
        id:
          type: string
        orderId:
          type: string
        productId:
          type: string
        skuId:
          type: string
          nullable: true
        quantity:
          type: integer
        unitPrice:
          type: number
          format: double
        finalUnitPrice:
          type: number
          format: double
          nullable: true
        selectedOptions:
          type: object
          nullable: true

    CartItem:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        skuId:
          type: string
          nullable: true
        productName:
          type: string
        image:
          type: string
          nullable: true
          description: URL of the product's primary image, if any.
        quantity:
          type: integer
        unitPrice:
          type: number
          format: double
        lineTotal:
          type: number
          format: double
        availableStock:
          type: integer
        options:
          type: object
          nullable: true
          description: Selected SKU variant options, if this line item is for a specific SKU.
        weightGrams:
          type: integer
          example: 500

    Cart:
      type: object
      description: The customer's cart, its line items, and computed subtotal.
      properties:
        cart:
          type: object
          properties:
            id:
              type: string
            userId:
              type: string
            sellerId:
              type: string
              nullable: true
              description: All items in a cart belong to a single seller. Null when the cart is empty.
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        subtotal:
          type: number
          format: double
        sellerId:
          type: string
          nullable: true

    Coupon:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
          example: WELCOME10
        type:
          type: string
          enum: [PERCENTAGE, FIXED]
        value:
          type: number
          format: double
          example: 10
        currency:
          type: string
          example: INR
        minOrder:
          type: number
          format: double
          nullable: true
        maxUses:
          type: integer
          nullable: true
        usedCount:
          type: integer
        perUserLimit:
          type: integer
        expiresAt:
          type: string
          format: date-time
          nullable: true
        isActive:
          type: boolean
        isStackable:
          type: boolean
        scopeType:
          type: string
          enum: [ALL, CATEGORY, PRODUCT, USER_SEGMENT]
        scopeIds:
          type: array
          items:
            type: string
        firstTimeOnly:
          type: boolean
        userSegment:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        _count:
          type: object
          description: Present on list responses.
          properties:
            usages:
              type: integer

    CouponUsage:
      type: object
      properties:
        userId:
          type: string
        orderId:
          type: string
        discount:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time

    OrderNegotiation:
      type: object
      properties:
        id:
          type: string
        orderId:
          type: string
        proposedBy:
          type: string
        proposedByType:
          type: string
          enum: [seller, customer]
        proposedPrice:
          type: number
          format: double
        status:
          $ref: "#/components/schemas/NegotiationStatus"
        meetLink:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    Payment:
      type: object
      properties:
        id:
          type: string
        orderId:
          type: string
        razorpayOrderId:
          type: string
        razorpayPaymentId:
          type: string
          nullable: true
        amount:
          type: number
          format: double
        currency:
          type: string
          example: INR
        type:
          $ref: "#/components/schemas/PaymentType"
        status:
          $ref: "#/components/schemas/PaymentStatus"
        attempts:
          type: integer
        refundId:
          type: string
          nullable: true
        refundAmount:
          type: number
          format: double
          nullable: true
        createdAt:
          type: string
          format: date-time

    Shipment:
      type: object
      properties:
        id:
          type: string
        orderId:
          type: string
        orderAddressId:
          type: string
          nullable: true
        shopId:
          type: string
        provider:
          type: string
          example: SHIPROCKET
        trackingId:
          type: string
          nullable: true
        trackingUrl:
          type: string
          format: uri
          nullable: true
        status:
          $ref: "#/components/schemas/ShipmentStatus"
        estimatedDelivery:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    ReturnRequest:
      type: object
      properties:
        id:
          type: string
        orderId:
          type: string
