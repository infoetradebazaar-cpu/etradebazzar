  # ---- Templates ----
  /api/templates/product/{productId}:
    get:
      tags: [Templates]
      summary: List active templates for a product
      security: []
      description: Public endpoint. Returns active templates associated with a product, newest first.
      parameters:
        - $ref: "#/components/parameters/productId"
      responses:
        "200":
          description: List of active templates.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Template"

  /api/templates/{templateId}:
    get:
      tags: [Templates]
      summary: Get a template
      security: []
      description: Public endpoint. Returns a single active template by ID.
      parameters:
        - $ref: "#/components/parameters/templateId"
      responses:
        "200":
          description: Template record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Template"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Templates]
      summary: Update a template
      description: |
        Required seller role: owner or manager.

        Updates name, industry, style, canvasState, and/or isActive for a template owned by the
        authenticated seller.
      parameters:
        - $ref: "#/components/parameters/templateId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                industry:
                  type: string
                style:
                  type: string
                canvasState:
                  type: object
                isActive:
                  type: boolean
      responses:
        "200":
          description: Updated template.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Template"
        "400":
          description: Validation failure, or template not found for this seller.
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Templates]
      summary: Delete a template
      description: |
        Required seller role: owner or manager.

        Deletes the template record and its thumbnail from object storage.
      parameters:
        - $ref: "#/components/parameters/templateId"
      responses:
        "200":
          description: Template deleted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted:
                            type: boolean
                            example: true
        "400":
          description: Template not found for this seller.
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/templates:
    get:
      tags: [Templates]
      summary: List the authenticated seller's templates
      description: |
        Required seller role: owner, manager, or staff.

        Includes each template's associated product (id and name only).
      responses:
        "200":
          description: Seller's templates.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Template"
                        - type: object
                          properties:
                            product:
                              type: object
                              properties:
                                id:
                                  type: string
                                name:
                                  type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Templates]
      summary: Create a template
      description: |
        Required seller role: owner or manager.

        Multipart upload. The product must belong to the authenticated seller. The thumbnail is
        uploaded to object storage; JPEG, PNG, and WEBP are accepted, up to 5MB. `canvasState` may
        be sent as a JSON-encoded string or a JSON object.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [productId, name, thumbnail]
              properties:
                productId:
                  type: string
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                industry:
                  type: string
                style:
                  type: string
                canvasState:
                  type: string
                  description: JSON-encoded canvas/design state.
                thumbnail:
                  type: string
                  format: binary
      responses:
        "201":
          description: Created template.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Template"
        "400":
          description: Missing thumbnail file, product not found for this seller, or invalid thumbnail file type.
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---- Upload Assets ----
  /api/upload-asset:
    post:
      tags: [Upload Assets]
      summary: Upload a generic asset
      description: |
        Any authenticated user. Multipart upload of a single file to object storage. Allowed MIME
        types: image/jpeg, image/png, image/webp, image/gif, application/pdf. `category` selects the
        storage bucket/prefix and the max file size: customer-uploads (10MB, default), shop-assets
        (10MB), kyc-documents (5MB).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                category:
                  type: string
                  enum: [customer-uploads, shop-assets, kyc-documents]
                  default: customer-uploads
      responses:
        "201":
          description: Uploaded asset record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/UploadAsset"
        "400":
          description: File required, invalid file type, invalid category, or file too large for the given category.
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    get:
      tags: [Upload Assets]
      summary: List the authenticated user's recent uploads
      parameters:
        - name: limit
          in: query
          schema:
            type: string
            pattern: "^\\d+$"
          description: Max records to return, capped at 100. Defaults to 20.
      responses:
        "200":
          description: Recent uploaded assets, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/UploadAsset"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/upload-asset/{assetId}:
    delete:
      tags: [Upload Assets]
      summary: Delete an uploaded asset
      description: Deletes an asset owned by the authenticated user, both its database record and its object storage file.
      parameters:
        - $ref: "#/components/parameters/assetId"
      responses:
        "200":
          description: Asset deleted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted:
                            type: boolean
                            example: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---- Users ----
  /api/users:
    get:
