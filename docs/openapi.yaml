          $ref: "#/components/responses/BadRequest"

  /api/products/{productId}/images/{imageId}:
    delete:
      tags: [Product Images]
      summary: Delete a product image
      description: "Required seller role: owner or manager."
      parameters:
        - $ref: "#/components/parameters/productId"
        - $ref: "#/components/parameters/imageId"
      responses:
        "200":
          description: Image deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"
        "400":
          description: Product or image not found.
          $ref: "#/components/responses/BadRequest"

  /api/products/{productId}/variants:
    get:
      tags: [Product Variants]
      summary: List variant options
      security: []
      parameters:
        - $ref: "#/components/parameters/productId"
      responses:
        "200":
          description: Variant options with their values.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/VariantOption"
    post:
      tags: [Product Variants]
      summary: Create a variant option
      description: |
        Creates a variant option (e.g., "Color") with its initial values (e.g., ["Red", "Blue"]).
        Approved products cannot have their variants modified.

        Required seller role: owner or manager.
      parameters:
        - $ref: "#/components/parameters/productId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, values]
              properties:
                name:
                  type: string
                  maxLength: 50
                  example: Color
                values:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  example: [Red, Blue, Green]
      responses:
        "201":
          description: Variant option created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/VariantOption"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/products/{productId}/variants/{optionId}/values:
    post:
      tags: [Product Variants]
      summary: Add values to a variant option
      description: "Required seller role: owner or manager."
      parameters:
        - $ref: "#/components/parameters/productId"
        - $ref: "#/components/parameters/optionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: array
                  items:
                    type: string
                  minItems: 1
      responses:
        "200":
          description: Values added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/products/{productId}/variants/{optionId}:
    delete:
      tags: [Product Variants]
      summary: Delete a variant option
      description: |
        All SKUs must be deleted before removing a variant option.

        Required seller role: owner or manager.
      parameters:
        - $ref: "#/components/parameters/productId"
        - $ref: "#/components/parameters/optionId"
      responses:
        "200":
          description: Variant option deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/products/{productId}/variants/{optionId}/values/{valueId}:
    delete:
      tags: [Product Variants]
      summary: Delete a variant value
      description: |
        Cannot delete a value that is in use by existing SKUs.

        Required seller role: owner or manager.
      parameters:
        - $ref: "#/components/parameters/productId"
        - $ref: "#/components/parameters/optionId"
        - $ref: "#/components/parameters/valueId"
      responses:
        "200":
          description: Variant value deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/products/{productId}/skus:
    get:
      tags: [Product Variants]
      summary: List SKUs
      security: []
      parameters:
        - $ref: "#/components/parameters/productId"
      responses:
        "200":
          description: All SKUs for the product.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProductSKU"
    post:
      tags: [Product Variants]
      summary: Create a SKU
      description: |
        The options map must reference existing variant option names and values.
        SKU codes must be unique across the platform.

        Required seller role: owner or manager.
      parameters:
        - $ref: "#/components/parameters/productId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, price, stock, options]
              properties:
                sku:
                  type: string
                  maxLength: 100
                  example: SKU-WBH-RED-L
                price:
                  type: number
                  format: double
                  example: 1299.00
                stock:
                  type: integer
                  minimum: 0
                  example: 50
                minQuantity:
                  type: integer
                  minimum: 1
                  default: 1
                options:
                  type: object
                  additionalProperties:
                    type: string
                  example:
                    Color: Red
                    Size: L
      responses:
        "201":
          description: SKU created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/ProductSKU"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/products/{productId}/skus/{skuId}:
    get:
      tags: [Product Variants]
      summary: Get a SKU
      security: []
      parameters:
        - $ref: "#/components/parameters/productId"
        - $ref: "#/components/parameters/skuId"
      responses:
        "200":
          description: SKU record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/ProductSKU"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Product Variants]
      summary: Update a SKU
      description: "Required seller role: owner or manager."
      parameters:
        - $ref: "#/components/parameters/productId"
        - $ref: "#/components/parameters/skuId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                price:
                  type: number
                  format: double
                stock:
                  type: integer
                  minimum: 0
                minQuantity:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: SKU updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
    delete:
      tags: [Product Variants]
      summary: Delete a SKU
      description: |
        Cannot delete a SKU that is referenced by existing orders.

        Required seller role: owner or manager.
      parameters:
        - $ref: "#/components/parameters/productId"
        - $ref: "#/components/parameters/skuId"
      responses:
        "200":
          description: SKU deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/orders:
    post:
      tags: [Orders]
      summary: Create an order
      description: |
        Creates a new order for the authenticated customer. SAMPLE orders are limited
        to 2 line items. All products must be in APPROVED status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sellerId, type, items, deliveryAddress]
              properties:
                sellerId:
                  type: string
                type:
                  type: string
                  enum: [STANDARD, SAMPLE]
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [productId, quantity]
                    properties:
                      productId:
                        type: string
                      quantity:
                        type: integer
                        minimum: 1
                deliveryAddress:
                  $ref: "#/components/schemas/DeliveryAddress"
      responses:
        "201":
          description: Order created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Order"
        "400":
          description: Products not found/approved, or sample order limit exceeded.
          $ref: "#/components/responses/BadRequest"
    get:
      tags: [Orders]
      summary: List seller's orders
      description: |
        Returns all orders for the authenticated seller's tenant, optionally filtered by status.

        Required seller role: owner, manager, or staff.
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OrderStatus"
      responses:
        "200":
          description: Orders.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"

  /api/orders/bulk:
    post:
      tags: [Orders]
      summary: Create a bulk order
      description: |
        Creates a BULK order from an XLSX file containing delivery addresses. The file
        is parsed asynchronously and addresses are assigned to shops by proximity.

        Rate limit: upload limiter (20 per minute).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, sellerId, items]
              properties:
                file:
                  type: string
                  format: binary
                  description: XLSX file with delivery addresses.
                sellerId:
                  type: string
                items:
                  type: string
                  description: JSON-stringified array of order items.
      responses:
        "201":
          description: Bulk order created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Missing file, empty file, or invalid products.
          $ref: "#/components/responses/BadRequest"

  /api/orders/{orderId}:
    get:
      tags: [Orders]
      summary: Get an order
      parameters:
        - $ref: "#/components/parameters/orderId"
      responses:
        "200":
          description: Order with items, addresses, negotiations, payments, and shipments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Order"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/orders/{orderId}/negotiate:
    post:
      tags: [Orders]
      summary: Submit a negotiation proposal
      description: |
        Either the seller or the customer can submit a price proposal. The order must
        be in NEGOTIATING status.
      parameters:
        - $ref: "#/components/parameters/orderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proposedPrice]
              properties:
                proposedPrice:
                  type: number
                  format: double
                  minimum: 0.01
                note:
                  type: string
                meetLink:
                  type: string
                  format: uri
      responses:
        "201":
          description: Proposal submitted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/OrderNegotiation"
        "400":
          description: Order not found or not in NEGOTIATING status.
          $ref: "#/components/responses/BadRequest"

  /api/orders/{orderId}/negotiate/{negotiationId}:
    patch:
      tags: [Orders]
      summary: Respond to a negotiation proposal
      parameters:
        - $ref: "#/components/parameters/orderId"
        - $ref: "#/components/parameters/negotiationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [ACCEPT, REJECT, COUNTER]
                counterPrice:
                  type: number
                  format: double
                  description: Required when action is COUNTER.
                note:
                  type: string
      responses:
        "200":
          description: Response recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Negotiation not found, already responded to, or order not found.
          $ref: "#/components/responses/BadRequest"

  /api/orders/{orderId}/addresses/{addressId}/assign:
    patch:
      tags: [Orders]
      summary: Assign a shop to a delivery address
      description: |
        Assigns a specific seller shop to fulfill a delivery address on a bulk order.

        Required seller role: owner, manager, or staff.
      parameters:
        - $ref: "#/components/parameters/orderId"
        - $ref: "#/components/parameters/addressId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shopId]
              properties:
                shopId:
                  type: string
      responses:
        "200":
          description: Shop assigned to address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Address, shop not found, or shop not approved.
          $ref: "#/components/responses/BadRequest"

  /api/orders/threshold:
    post:
      tags: [Orders]
      summary: Set order threshold
      description: |
        Sets the minimum order amount threshold for the seller, optionally scoped
        to a product category.

        Required seller role: owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                productCategory:
                  type: string
                  description: Omit to set a global threshold.
                amount:
                  type: number
                  format: double
                  minimum: 0.01
      responses:
        "200":
          description: Threshold set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /api/orders/commission:
    post:
      tags: [Orders]
      summary: Set product commission rate
      description: |
        Sets the platform commission rate for a specific product or category.
        Either productId or category must be provided, not both.

        Required platform role: super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rate]
              properties:
                productId:
                  type: string
                category:
                  type: string
                rate:
                  type: number
                  format: double
                  minimum: 0
                  maximum: 100
                  description: Commission percentage (0.00 to 100.00).
      responses:
        "201":
          description: Commission rate set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Neither productId nor category provided.
          $ref: "#/components/responses/BadRequest"

  /api/payments/orders/{orderId}/advance:
    post:
      tags: [Payments]
      summary: Create advance payment
      description: |
        Creates a Razorpay order for the advance payment on a confirmed order.
        Advance payment can only be initiated once.

        Rate limit: payment limiter (30 per minute per IP).
      parameters:
        - $ref: "#/components/parameters/orderId"
      responses:
        "201":
          description: Razorpay order created. Pass razorpayOrderId to the Razorpay SDK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Payment"
        "400":
          description: Order not found, not in payable state, or advance already initiated.
          $ref: "#/components/responses/BadRequest"

  /api/payments/orders/{orderId}/final:
    post:
      tags: [Payments]
      summary: Create final payment
      description: |
        Creates a Razorpay order for the final payment. Advance payment must be
        fully completed before this can be initiated.

        Rate limit: payment limiter (30 per minute per IP).
      parameters:
        - $ref: "#/components/parameters/orderId"
      responses:
        "201":
          description: Razorpay order created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Payment"
        "400":
          description: Order not found, advance not completed, or final already initiated.
          $ref: "#/components/responses/BadRequest"

  /api/payments/verify:
    post:
      tags: [Payments]
      summary: Verify and capture a payment
      description: |
        Verifies the Razorpay signature and marks the payment as captured. Call this
        immediately after the user completes payment in the Razorpay SDK.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [razorpayOrderId, razorpayPaymentId, razorpaySignature]
              properties:
                razorpayOrderId:
                  type: string
                  example: order_1234abcd
                razorpayPaymentId:
                  type: string
                  example: pay_1234abcd
                razorpaySignature:
                  type: string
                  description: HMAC-SHA256 signature from the Razorpay SDK callback.
      responses:
        "200":
          description: Payment verified and captured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Invalid payment signature.
          $ref: "#/components/responses/BadRequest"

  /api/payments/orders/{orderId}/refund:
    post:
      tags: [Payments]
      summary: Initiate a refund
      description: The order must be cancelled before a refund can be initiated.
      parameters:
        - $ref: "#/components/parameters/orderId"
      responses:
        "200":
          description: Refund initiated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Order not found, not cancelled, or no payments to refund.
          $ref: "#/components/responses/BadRequest"

  /api/payments/orders/{orderId}:
    get:
      tags: [Payments]
      summary: Get payments for an order
      parameters:
        - $ref: "#/components/parameters/orderId"
      responses:
        "200":
          description: All payment records for the order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Payment"

  /api/payments/webhook:
    post:
      tags: [Payments]
      summary: Razorpay payment webhook
      security: []
      description: |
        Endpoint for Razorpay to POST payment events. Validates the
        X-Razorpay-Signature header before processing. Register this URL in the
        Razorpay dashboard under webhook settings.
      parameters:
        - name: X-Razorpay-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Webhook processed.
        "400":
          description: Missing or invalid signature.

  /api/shipments:
    get:
      tags: [Shipments]
      summary: List shipments
      description: "Returns paginated, filterable shipments for the authenticated seller. Required seller role: owner, manager, or staff."
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: shopId
          in: query
          schema:
            type: string
        - name: courierPartner
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Shipments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Shipment"
                  meta:
                    type: object
                    description: Pagination metadata.

  /api/shipments/with-orders:
    get:
      tags: [Shipments]
      summary: List shipments with their order details
      description: "Returns all shipments for the authenticated seller, each joined with its order. Required seller role: owner, manager, or staff."
      responses:
        "200":
          description: Shipments with order details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /api/shipments/bulk-cancel:
    post:
      tags: [Shipments]
      summary: Cancel multiple shipments
      description: "Required seller role: owner or manager."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shipmentIds]
              properties:
                shipmentIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
      responses:
        "200":
          description: Per-shipment cancellation results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /api/shipments/export:
    get:
      tags: [Shipments]
      summary: Export shipments as CSV
      description: "Required seller role: owner or manager."
      responses:
        "200":
          description: CSV file (shipmentId, orderId, status, courier, awb, createdAt columns).
          content:
            text/csv:
              schema:
                type: string

  /api/shipments/serviceability:
    get:
      tags: [Shipments]
      summary: Check serviceability
      description: |
        Checks Shiprocket courier serviceability between two pincodes.

        Required seller role: owner, manager, or staff.
      parameters:
        - name: pickupPincode
          in: query
          required: true
          schema:
            type: string
        - name: deliveryPincode
          in: query
          required: true
          schema:
            type: string
        - name: weightKg
          in: query
          required: true
          schema:
            type: number
        - name: cod
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Serviceability results with available courier options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Missing required query parameters.
          $ref: "#/components/responses/BadRequest"

  /api/shipments/{shipmentId}:
    get:
      tags: [Shipments]
      summary: Get a shipment
      description: "Required seller role: owner, manager, or staff."
      parameters:
        - $ref: "#/components/parameters/shipmentId"
      responses:
        "200":
          description: Shipment record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Shipment"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/shipments/{shipmentId}/with-order:
    get:
      tags: [Shipments]
      summary: Get a shipment with its order details
      description: "Required seller role: owner, manager, or staff."
      parameters:
        - $ref: "#/components/parameters/shipmentId"
      responses:
        "200":
          description: Shipment joined with order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/shipments/{shipmentId}/track:
    get:
      tags: [Shipments]
      summary: Track a shipment
      description: "Required seller role: owner, manager, or staff."
      parameters:
        - $ref: "#/components/parameters/shipmentId"
      responses:
        "200":
          description: Tracking information from Shiprocket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Shipment not found or no tracking ID available yet.
          $ref: "#/components/responses/BadRequest"

  /api/shipments/{shipmentId}/cancel:
    patch:
      tags: [Shipments]
      summary: Cancel a shipment
      description: |
        Cannot cancel a shipment that has already been delivered.

        Required seller role: owner or manager.
      parameters:
        - $ref: "#/components/parameters/shipmentId"
      responses:
        "200":
          description: Shipment cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Shipment not found or already delivered.
          $ref: "#/components/responses/BadRequest"

  /api/shipments/webhook:
    post:
      tags: [Shipments]
      summary: Shiprocket shipment webhook
      security: []
      description: |
        Endpoint for Shiprocket to POST tracking status updates. Validates the
        X-Shiprocket-Signature header before processing.
      parameters:
        - name: X-Shiprocket-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Webhook processed.
        "400":
          description: Missing or invalid signature.

  /api/returns:
    post:
      tags: [Returns]
      summary: Create a return request
      description: |
        Customer submits a return request for a delivered order. Only one return
        request is allowed per order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, reason]
              properties:
                orderId:
                  type: string
                reason:
                  type: string
                  minLength: 10
      responses:
        "201":
          description: Return request created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/ReturnRequest"
        "400":
          description: Order not found, not delivered, or return already exists.
          $ref: "#/components/responses/BadRequest"
    get:
      tags: [Returns]
      summary: List return requests for seller
      description: "Required seller role: owner, manager, or staff."
      responses:
        "200":
          description: Return requests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReturnRequest"

  /api/returns/my:
    get:
      tags: [Returns]
      summary: List customer's own return requests
      responses:
        "200":
          description: Return requests by the authenticated customer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReturnRequest"

  /api/returns/{returnId}:
    get:
      tags: [Returns]
      summary: Get a return request
      description: "Required seller role: owner, manager, or staff."
      parameters:
        - $ref: "#/components/parameters/returnId"
      responses:
        "200":
          description: Return request record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/ReturnRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/returns/{returnId}/approve:
    patch:
      tags: [Returns]
      summary: Approve a return request
      description: |
        Approves the return and initiates a return shipment via Shiprocket.

        Required seller role: owner or manager.
      parameters:
        - $ref: "#/components/parameters/returnId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
      responses:
        "200":
          description: Return approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Return not found, not pending, or shop/address not found.
          $ref: "#/components/responses/BadRequest"

  /api/returns/{returnId}/reject:
    patch:
      tags: [Returns]
      summary: Reject a return request
      description: "Required seller role: owner or manager."
      parameters:
        - $ref: "#/components/parameters/returnId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note:
                  type: string
                  minLength: 5
      responses:
        "200":
          description: Return rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Return not found or not pending.
          $ref: "#/components/responses/BadRequest"

  /api/payouts/me:
    get:
      tags: [Payouts]
      summary: Get own payout summary
      description: Returns the payout summary for the authenticated seller.
      responses:
        "200":
          description: Payout summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/payouts/config:
    post:
      tags: [Payouts]
      summary: Set platform configuration
      description: |
        Sets a key-value platform configuration entry (e.g., commission rates,
        feature flags).

        Required platform role: super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key:
                  type: string
                  example: default_commission_rate
                value:
                  type: string
                  example: "5.00"
      responses:
        "200":
          description: Configuration saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /api/payouts/sellers:
    get:
      tags: [Payouts]
      summary: List all sellers' payout summaries
      description: "Required platform role: super_admin or onboarding_manager."
      responses:
        "200":
          description: Payout summaries for all sellers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /api/payouts/sellers/{sellerId}:
    get:
      tags: [Payouts]
      summary: Get a seller's payout summary
      description: "Required platform role: super_admin or onboarding_manager."
      parameters:
        - $ref: "#/components/parameters/sellerId"
      responses:
        "200":
          description: Seller payout summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/payouts/sellers/{sellerId}/initiate:
    post:
      tags: [Payouts]
      summary: Initiate a payout
      description: |
        Triggers a Razorpay payout to the seller's registered bank account or UPI.
        All unpaid confirmed orders for the seller are included.

        Required platform role: super_admin.
        Rate limit: payment limiter (30 per minute per IP).
      parameters:
        - $ref: "#/components/parameters/sellerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method:
                  $ref: "#/components/schemas/PayoutMethod"
                note:
                  type: string
                periodStart:
                  type: string
                  format: date-time
                periodEnd:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Payout initiated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/SellerPayout"
        "400":
          description: Seller not found, bank details missing, no unpaid orders, or zero net amount.
          $ref: "#/components/responses/BadRequest"

  /api/payouts/history:
    get:
      tags: [Payouts]
      summary: Get platform-wide payout history
      description: "Required platform role: super_admin or onboarding_manager."
      responses:
        "200":
          description: All payout records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SellerPayout"

  /api/payouts/history/{sellerId}:
    get:
      tags: [Payouts]
      summary: Get payout history for a seller
      description: "Required platform role: super_admin or onboarding_manager."
      parameters:
        - $ref: "#/components/parameters/sellerId"
      responses:
        "200":
          description: Payout records for the seller.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SellerPayout"

  /api/payouts/{payoutId}:
    get:
      tags: [Payouts]
      summary: Get a payout by ID
      description: "Required platform role: super_admin or onboarding_manager."
      parameters:
        - $ref: "#/components/parameters/payoutId"
      responses:
        "200":
          description: Payout record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/SellerPayout"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/payouts/webhook:
    post:
      tags: [Payouts]
      summary: Razorpay payout webhook
      security: []
      description: |
        Endpoint for Razorpay to POST payout status events. Validates the
        X-Razorpay-Signature header before processing.
      parameters:
        - name: X-Razorpay-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Webhook processed.
        "400":
          description: Missing or invalid signature.

  /api/analytics/seller:
    get:
      tags: [Analytics]
      summary: Seller analytics overview
      description: |
        Returns aggregated order stats, revenue, and product metrics for the
        authenticated seller over the requested period.

        Required seller role: owner or manager.
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d]
        - name: from
          in: query
          schema:
            type: string
            format: date-time
          description: Start of a custom date range. Requires `to`.
        - name: to
          in: query
          schema:
            type: string
            format: date-time
          description: End of a custom date range. Requires `from`.
      responses:
        "200":
          description: Seller analytics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /api/analytics/seller/revenue:
    get:
      tags: [Analytics]
      summary: Seller daily revenue
      description: "Required seller role: owner or manager."
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d]
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Daily revenue time series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /api/analytics/seller/products:
    get:
      tags: [Analytics]
      summary: Seller top products
      description: "Required seller role: owner or manager."
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Top products by revenue or volume.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /api/analytics/seller/returns:
    get:
      tags: [Analytics]
      summary: Seller return rate
      description: "Required seller role: owner or manager."
      responses:
        "200":
          description: Return rate metrics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /api/analytics/platform:
    get:
      tags: [Analytics]
      summary: Platform analytics overview
      description: "Required platform role: super_admin or onboarding_manager."
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d]
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Platform-wide analytics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /api/analytics/platform/sellers:
    get:
      tags: [Analytics]
      summary: Top sellers
      description: "Required platform role: super_admin or onboarding_manager."
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Top sellers by revenue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /api/analytics/refresh:
    post:
      tags: [Analytics]
      summary: Refresh all materialized views
      description: "Required platform role: super_admin."
      responses:
        "200":
          description: All views refreshed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /api/analytics/refresh/{viewName}:
    post:
      tags: [Analytics]
      summary: Refresh a specific materialized view
      description: "Required platform role: super_admin."
      parameters:
        - $ref: "#/components/parameters/viewName"
      responses:
        "200":
          description: View refreshed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Unknown view name.
          $ref: "#/components/responses/BadRequest"

  /api/notifications:
    get:
      tags: [Notifications]
      summary: Get notifications
      description: Returns paginated notifications for the authenticated user.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated notifications.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      notifications:
                        type: array
                        items:
                          $ref: "#/components/schemas/Notification"
                      total:
                        type: integer
                      unread:
                        type: integer

  /api/notifications/stream:
    get:
      tags: [Notifications]
      summary: Subscribe to real-time notifications (SSE)
      description: |
        Opens a Server-Sent Events stream for the authenticated user. The client
        receives new notification events as they are published, without polling.

        Set the request Accept header to `text/event-stream`. Reconnect on
        connection close using the standard EventSource API.

        Each event has the format:
        `data: { "type": "NOTIFICATION_TYPE", "title": "...", "message": "...", "data": {} }`
      responses:
        "200":
          description: SSE stream opened.
          content:
            text/event-stream:
              schema:
                type: string

  /api/notifications/read:
    patch:
      tags: [Notifications]
      summary: Mark specific notifications as read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  minItems: 1
      responses:
        "200":
          description: Notifications marked as read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /api/notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: All notifications marked as read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /api/platform/roles:
    get:
      tags: [Platform]
      summary: List platform roles
      description: "Required platform role: super_admin."
      responses:
        "200":
          description: Platform roles.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlatformRole"
    post:
      tags: [Platform]
      summary: Create a platform role
      description: "Required platform role: super_admin."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 50
                  example: support_agent
                description:
                  type: string
      responses:
        "201":
          description: Role created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/PlatformRole"
        "409":
          description: Role already exists.
          $ref: "#/components/responses/Conflict"

  /api/platform/roles/{roleId}:
    patch:
      tags: [Platform]
      summary: Update a platform role
      description: "Protected roles cannot be renamed. Required platform role: super_admin."
      parameters:
        - $ref: "#/components/parameters/roleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        "200":
          description: Role updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Role not found or protected role rename attempted.
          $ref: "#/components/responses/BadRequest"
    delete:
      tags: [Platform]
      summary: Delete a platform role
      description: |
        Cannot delete a protected role or a role with active members.

        Required platform role: super_admin.
      parameters:
        - $ref: "#/components/parameters/roleId"
      responses:
        "200":
          description: Role deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"
        "400":
          description: Role not found, protected, or has members.
          $ref: "#/components/responses/BadRequest"

  /api/platform/members:
    get:
      tags: [Platform]
      summary: List platform members
      description: "Required platform role: super_admin."
      responses:
        "200":
          description: Platform members.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlatformMember"
    post:
      tags: [Platform]
      summary: Add a platform member
      description: |
        Grants an existing user a platform role. The user must already have an account.

        Required platform role: super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, roleId]
              properties:
                email:
                  type: string
                  format: email
                roleId:
                  type: string
      responses:
        "201":
          description: Member added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: User not found, role not found, or user already a member.
          $ref: "#/components/responses/BadRequest"

  /api/platform/members/{memberId}/role:
    patch:
      tags: [Platform]
      summary: Update a platform member's role
      description: "Required platform role: super_admin."
      parameters:
        - $ref: "#/components/parameters/memberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId]
              properties:
                roleId:
                  type: string
      responses:
        "200":
          description: Member role updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/platform/members/{memberId}:
    delete:
      tags: [Platform]
      summary: Remove a platform member
      description: |
        The last super_admin cannot be removed.

        Required platform role: super_admin.
      parameters:
        - $ref: "#/components/parameters/memberId"
      responses:
        "200":
          description: Member removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"
        "400":
          description: Member not found or last super_admin removal attempted.
          $ref: "#/components/responses/BadRequest"

  /api/platform/audit-logs:
    get:
      tags: [Platform]
      summary: Get audit logs
      description: "Required platform role: super_admin, onboarding_manager, or product_reviewer."
      parameters:
        - name: sellerId
          in: query
          schema:
            type: string
        - name: actorId
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Audit log entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLog"

  # ---- Address ----
  /api/addresses:
    get:
      tags: [Address]
      summary: List saved addresses
      description: Returns the authenticated customer's saved addresses, default address first.
      responses:
        "200":
          description: Customer addresses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CustomerAddress"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Address]
      summary: Create a saved address
      description: |
        Adds a new address to the authenticated customer's address book. If `city`
        or `state` is omitted, they are auto-filled from a pincode lookup. The
        first address created for a customer is automatically marked default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receiverName, phone, street, pincode]
              properties:
                label:
                  type: string
                  example: Home
                receiverName:
                  type: string
                  minLength: 2
                  example: Rahul Mehta
                phone:
                  type: string
                  pattern: '^\+?[6-9]\d{9}$'
                  example: "9876543210"
                street:
                  type: string
                  minLength: 5
                city:
                  type: string
                  minLength: 2
                state:
                  type: string
                  minLength: 2
                pincode:
                  type: string
                  pattern: '^\d{6}$'
                latitude:
                  type: number
                longitude:
                  type: number
                isDefault:
                  type: boolean
      responses:
        "201":
          description: Address created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/CustomerAddress"
        "400":
          description: City/state could not be determined from the provided pincode and were not supplied.
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/addresses/{addressId}:
    patch:
      tags: [Address]
      summary: Update a saved address
      description: Partially updates one of the authenticated customer's addresses.
      parameters:
        - $ref: "#/components/parameters/customerAddressId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                receiverName:
                  type: string
                  minLength: 2
                phone:
                  type: string
                  pattern: '^\+?[6-9]\d{9}$'
                street:
                  type: string
                  minLength: 5
                city:
                  type: string
                  minLength: 2
                state:
                  type: string
                  minLength: 2
                pincode:
                  type: string
                  pattern: '^\d{6}$'
                latitude:
                  type: number
                longitude:
                  type: number
                isDefault:
                  type: boolean
      responses:
        "200":
          description: Address updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/CustomerAddress"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Address]
      summary: Delete a saved address
      description: |
        Deletes one of the authenticated customer's addresses. If the deleted
        address was the default, the next-oldest remaining address (if any) is
        promoted to default.
      parameters:
        - $ref: "#/components/parameters/customerAddressId"
      responses:
        "200":
          description: Address deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      deleted:
                        type: boolean
                        example: true
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---- Cart ----
  /api/cart:
    get:
      tags: [Cart]
      summary: Get the current cart
      description: Returns the authenticated customer's cart, creating an empty one if none exists yet.
      responses:
        "200":
          description: Cart with line items and subtotal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Cart"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Cart]
      summary: Clear the cart
      description: Removes all items from the authenticated customer's cart and unassigns its seller.
      responses:
        "200":
          description: Cart cleared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      cleared:
                        type: boolean
                        example: true
        "500":
          $ref: "#/components/responses/InternalError"

  /api/cart/items:
    post:
      tags: [Cart]
      summary: Add an item to the cart
      description: |
        Adds a product (optionally a specific SKU) to the cart. A cart may only
        hold items from a single seller at a time  adding a product from a
        different seller clears the existing items and re-assigns the cart's
        seller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId:
                  type: string
                skuId:
                  type: string
                quantity:
                  type: integer
                  minimum: 1
      responses:
        "201":
          description: Item added. Returns the full updated cart.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Cart"
        "400":
          description: Product not found, product not approved, or insufficient stock.
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/cart/items/{itemId}:
    patch:
      tags: [Cart]
      summary: Update a cart item's quantity
      parameters:
        - $ref: "#/components/parameters/itemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Item updated. Returns the full updated cart.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Cart"
        "400":
          description: Quantity must be greater than 0, cart item not found, or insufficient stock.
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Cart]
      summary: Remove an item from the cart
      description: |
        Removes a single line item. If it was the last item in the cart, the
        cart's seller assignment is cleared as well.
      parameters:
        - $ref: "#/components/parameters/itemId"
      responses:
        "200":
          description: Item removed. Returns the full updated cart.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Cart"
        "400":
          description: Cart item not found.
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/cart/checkout:
    post:
      tags: [Cart]
      summary: Checkout the cart into an order
      description: |
        Converts the authenticated customer's cart into an order. Requires either
        `addressId` (an existing saved address) or `newAddress` (an inline delivery
        address). If `couponCode` is supplied it is validated and applied
        atomically with order creation. For Cash on Delivery, seller-to-customer
        serviceability is checked before the order is created. The cart is
        emptied once the order is created.

        `idempotencyKey` must be a UUID; retrying the same key while a prior
        request is still in flight returns a 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotencyKey]
              properties:
                idempotencyKey:
                  type: string
                  format: uuid
                addressId:
                  type: string
                  description: CUID of a saved address. Mutually exclusive with `newAddress`; one of the two is required.
                newAddress:
                  type: object
                  description: Inline delivery address. Mutually exclusive with `addressId`; one of the two is required.
                  required: [receiverName, phone, street, city, state, pincode]
                  properties:
                    receiverName:
                      type: string
                      minLength: 2
                    phone:
                      type: string
                    street:
                      type: string
                      minLength: 5
                    city:
                      type: string
                      minLength: 2
                    state:
                      type: string
                      minLength: 2
                    pincode:
                      type: string
                      pattern: '^\d{6}$'
                    latitude:
                      type: number
                    longitude:
                      type: number
                couponCode:
                  type: string
                paymentMethod:
                  type: string
                  enum: [ONLINE, COD]
                  default: ONLINE
      responses:
        "201":
          description: Order created from the cart.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Order"
        "400":
          description: |
            Cart is empty, cart has no seller assigned, address not found, delivery
            address required, Cash on Delivery not available for this address, or
            an invalid/inapplicable coupon.
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Duplicate order submission with the same idempotency key detected while a prior request was still processing.
          $ref: "#/components/responses/Conflict"

  # ---- Coupons ----
  /api/coupons/validate:
    post:
      tags: [Coupons]
      summary: Validate a coupon code
      description: |
        Validates a coupon code against the authenticated customer, order amount,
        and (optionally) the product/category ids in the cart, and returns the
        computed discount. Does not consume the coupon  use during checkout to
        preview pricing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, orderAmount]
              properties:
                code:
                  type: string
                  minLength: 3
                orderAmount:
                  type: number
                  exclusiveMinimum: 0
                productIds:
                  type: array
                  items:
                    type: string
                categoryIds:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Coupon is valid. Returns the computed discount.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      coupon:
                        type: object
                        properties:
                          id:
                            type: string
                          code:
                            type: string
                          type:
                            type: string
                            enum: [PERCENTAGE, FIXED]
                          value:
                            type: number
                            format: double
                      discount:
                        type: number
                        format: double
                      finalAmount:
                        type: number
                        format: double
        "400":
          description: |
            Invalid coupon code, coupon not active/expired, usage limit reached,
            already used by this customer, first-time-buyers-only, or not
            applicable to the given products/categories.
          $ref: "#/components/responses/BadRequest"

  /api/coupons:
    post:
      tags: [Coupons]
      summary: Create a coupon
      description: |
        Creates a single coupon code.

        Required platform role: super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, type, value]
              properties:
                code:
                  type: string
                  minLength: 3
                  maxLength: 30
                type:
                  type: string
                  enum: [PERCENTAGE, FIXED]
                value:
                  type: number
                  exclusiveMinimum: 0
                  description: Percentage points (0-100) when type is PERCENTAGE, or a fixed amount otherwise.
                currency:
                  type: string
                  default: INR
                minOrder:
                  type: number
                  exclusiveMinimum: 0
                maxUses:
                  type: integer
                  minimum: 1
                perUserLimit:
                  type: integer
                  minimum: 1
                  default: 1
                expiresAt:
                  type: string
                  format: date-time
                isStackable:
                  type: boolean
                  default: false
                scopeType:
                  type: string
                  enum: [ALL, CATEGORY, PRODUCT, USER_SEGMENT]
                  default: ALL
                scopeIds:
                  type: array
                  items:
                    type: string
                firstTimeOnly:
                  type: boolean
                  default: false
                userSegment:
                  type: string
      responses:
        "201":
          description: Coupon created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Coupon"
        "400":
          description: Coupon code already exists, or percentage discount exceeds 100%.
          $ref: "#/components/responses/BadRequest"
    get:
      tags: [Coupons]
      summary: List coupons
      description: |
        Lists non-bulk coupons, optionally filtered.

        Required platform role: super_admin or onboarding_manager.
      parameters:
        - name: isActive
          in: query
          schema:
            type: string
            enum: ["true", "false"]
        - name: scopeType
          in: query
          schema:
            type: string
            enum: [ALL, CATEGORY, PRODUCT, USER_SEGMENT]
      responses:
        "200":
          description: Coupons.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Coupon"

  /api/coupons/bulk-generate:
    post:
      tags: [Coupons]
      summary: Bulk-generate coupon codes
      description: |
        Generates up to 1000 unique single-use coupon codes sharing a prefix and
        the same discount configuration, grouped under a `bulkGroupId`.

        Required platform role: super_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prefix, count, type, value]
              properties:
                prefix:
                  type: string
                  minLength: 2
                  maxLength: 15
                count:
                  type: integer
                  minimum: 1
                  maximum: 1000
                type:
                  type: string
                  enum: [PERCENTAGE, FIXED]
                value:
                  type: number
                  exclusiveMinimum: 0
                currency:
                  type: string
                  default: INR
                minOrder:
                  type: number
                  exclusiveMinimum: 0
                expiresAt:
                  type: string
                  format: date-time
                scopeType:
                  type: string
                  enum: [ALL, CATEGORY, PRODUCT, USER_SEGMENT]
                scopeIds:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          description: Coupons generated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      bulkGroupId:
                        type: string
                      generated:
                        type: integer
                      prefix:
                        type: string
        "400":
          description: Count exceeds 1000, or percentage discount exceeds 100%.
          $ref: "#/components/responses/BadRequest"

  /api/coupons/{couponId}:
    get:
      tags: [Coupons]
      summary: Get a coupon
      description: |
        Returns a coupon along with its 50 most recent usage records.

        Required platform role: super_admin or onboarding_manager.
      parameters:
        - $ref: "#/components/parameters/couponId"
      responses:
        "200":
          description: Coupon record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    allOf:
                      - $ref: "#/components/schemas/Coupon"
                      - type: object
                        properties:
                          usages:
                            type: array
                            items:
                              $ref: "#/components/schemas/CouponUsage"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Coupons]
      summary: Update a coupon
      description: |
        Updates mutable fields of a coupon.

        Required platform role: super_admin.
      parameters:
        - $ref: "#/components/parameters/couponId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isActive:
                  type: boolean
                expiresAt:
                  type: string
                  format: date-time
                maxUses:
                  type: integer
                  minimum: 1
                minOrder:
                  type: number
                  exclusiveMinimum: 0
      responses:
        "200":
          description: Coupon updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Coupon"
        "400":
          description: Coupon not found (returned as a 400 by this endpoint, not a 404).
          $ref: "#/components/responses/BadRequest"

  /api/coupons/{couponId}/deactivate:
    patch:
      tags: [Coupons]
      summary: Deactivate a coupon
      description: |
        Sets `isActive` to false. Writes a `COUPON_DEACTIVATED` audit log entry.

        Required platform role: super_admin.
      parameters:
        - $ref: "#/components/parameters/couponId"
      responses:
        "200":
          description: Coupon deactivated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Coupon"
        "400":
          description: Coupon not found (returned as a 400 by this endpoint, not a 404).
          $ref: "#/components/responses/BadRequest"

  # ---- Customers ----
  /api/customers/register:
    post:
      tags: [Customers]
      summary: Register a customer
      security: []
      description: |
        Creates a new customer account (User) with an initial default saved
        address, awards an onboarding credit bonus asynchronously, and returns
        an authenticated session (access + refresh tokens).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, phone, address]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  format: password
                phone:
                  type: string
                  minLength: 10
                  maxLength: 15
                address:
                  type: object
                  required: [street, city, state, pincode]
                  properties:
                    street:
                      type: string
                      minLength: 3
                    city:
                      type: string
                      minLength: 2
                    state:
                      type: string
                      minLength: 2
                    pincode:
                      type: string
                      minLength: 6
                      maxLength: 10
      responses:
        "201":
          description: Customer registered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/CustomerProfile"
                      accessToken:
                        type: string
                        description: JWT access token. Short-lived.
                      refreshToken:
                        type: string
                        description: JWT refresh token. Valid for 7 days.
        "409":
          description: Email already registered.
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/customers/profile:
    get:
      tags: [Customers]
      summary: Get the current customer's profile
      responses:
        "200":
          description: Customer profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/CustomerProfile"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Customers]
      summary: Update the current customer's profile
      description: Also triggers an asynchronous profile-completion credit check.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
      responses:
        "200":
          description: Profile updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/CustomerProfile"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/customers/phone/link-request:
    post:
      tags: [Customers]
      summary: Request an OTP to link a phone number
      description: |
        Sends an OTP to the given phone number to verify ownership before
        linking it to the authenticated customer's account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  minLength: 10
                  maxLength: 15
      responses:
        "200":
          description: OTP sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      sent:
                        type: boolean
                        example: true
        "409":
          description: Phone number already linked to another account.
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/customers/phone/link-verify:
    post:
      tags: [Customers]
      summary: Verify an OTP and link a phone number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, otp]
              properties:
                phone:
                  type: string
                  minLength: 10
                  maxLength: 15
                otp:
                  type: string
                  minLength: 6
                  maxLength: 6
      responses:
        "200":
          description: Phone linked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      phone:
                        type: string
                      phoneVerifiedAt:
                        type: string
                        format: date-time
        "400":
          description: Invalid or expired OTP.
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Phone number already linked to another account.
          $ref: "#/components/responses/Conflict"
        "429":
          description: Too many OTP verification attempts; request a new OTP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error: Too many attempts, request a new OTP
        "500":
          $ref: "#/components/responses/InternalError"

  /api/customers/orders:
    get:
      tags: [Customers]
      summary: List the current customer's orders
      description: Returns paginated orders placed by the authenticated customer, with items, seller, and shipment summaries.
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: Customer's orders.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                  meta:
                    type: object
                    description: Pagination metadata.
                    properties:
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
                      totalPages:
                        type: integer
        "500":
          $ref: "#/components/responses/InternalError"

  # ---- GST ----
  /api/gst/verify:
    post:
      tags: [GST]
      summary: Verify a GSTIN
      description: |
        Looks up a GSTIN against the configured GST verification provider (or a
        mock response when `GST_MOCK=true`). Available to any authenticated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gstin]
              properties:
                gstin:
                  type: string
                  minLength: 15
                  maxLength: 15
      responses:
        "200":
          description: GST details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/GstDetails"
        "400":
          description: Invalid GSTIN format.
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/gst/verify-autofill:
    post:
      tags: [GST]
      summary: Verify a GSTIN and autofill seller KYC
      description: |
        Verifies a GSTIN and, if the registration is active, writes it onto the
        authenticated seller's KYC record.

        Required seller role: owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gstin]
              properties:
                gstin:
                  type: string
                  minLength: 15
                  maxLength: 15
      responses:
        "200":
          description: GST details. The seller's KYC record has been updated with the GSTIN.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/GstDetails"
        "400":
          description: Invalid GSTIN format, GST registration is not active, or no KYC record exists yet for this seller.
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---- Location ----
  /api/location/pincode/{pincode}:
    get:
      tags: [Location]
      summary: Look up a pincode
      security: []
      description: Resolves an Indian pincode to city/state/district and postal circle details, for address autofill.
      parameters:
        - name: pincode
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{6}$'
          description: 6-digit Indian postal pincode.
      responses:
        "200":
          description: Pincode details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/PincodeDetails"
        "404":
          description: No location found for the provided pincode.
          $ref: "#/components/responses/NotFound"
        "502":
          description: The upstream pincode lookup service is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error: Pincode lookup service unavailable


  # ---- Print Areas ----
  /api/print-areas/{productId}:
    get:
      tags: [Print Areas]
      summary: Get a product's print area
      security: []
      description: Public endpoint. Returns the configured print/design area dimensions for a product.
      parameters:
        - $ref: "#/components/parameters/productId"
      responses:
        "200":
          description: Print area configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/PrintArea"
        "404":
          description: Print area not configured for this product.
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      tags: [Print Areas]
      summary: Set (create or update) a product's print area
      description: |
        Upserts the print area for a product owned by the caller's seller tenant. If no
        print area exists yet, one is created (defaulting safetyMarginCm to 0.5 and
        bleedMarginCm to 0.3 when omitted); otherwise the existing record is updated.

        Required seller role: owner or manager.
      parameters:
        - $ref: "#/components/parameters/productId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [widthCm, heightCm]
              properties:
                widthCm:
                  type: number
                  format: double
                  exclusiveMinimum: 0
                  example: 25.5
                heightCm:
                  type: number
                  format: double
                  exclusiveMinimum: 0
                  example: 35.0
                safetyMarginCm:
                  type: number
                  format: double
                  minimum: 0
                  example: 0.5
                bleedMarginCm:
                  type: number
                  format: double
                  minimum: 0
                  example: 0.3
      responses:
        "200":
          description: Print area created or updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/PrintArea"
        "400":
          description: Product not found (or not owned by the caller's seller).
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [Print Areas]
      summary: Delete a product's print area
      description: |
        Removes the print area configuration for a product owned by the caller's seller
        tenant. Idempotent: returns { deleted: false } if no print area existed.

        Required seller role: owner or manager.
      parameters:
        - $ref: "#/components/parameters/productId"
      responses:
        "200":
          description: Deletion result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      deleted:
                        type: boolean
        "400":
          description: Product not found (or not owned by the caller's seller).
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---- Reviews ----
  /api/reviews/product/{productId}:
    get:
      tags: [Reviews]
      summary: List approved reviews for a product
      security: []
      description: Public endpoint. Returns paginated approved reviews for a product, plus rating breakdown and average.
      parameters:
        - $ref: "#/components/parameters/productId"
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: rating
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5
          description: Filter to a single star rating.
      responses:
        "200":
          description: Approved reviews for the product.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      reviews:
                        type: array
                        items:
                          $ref: "#/components/schemas/Review"
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
                      avgRating:
                        type: number
                        format: double
                      totalRatings:
                        type: integer
                      breakdown:
                        type: object
                        description: Count of approved reviews per star rating (1-5), keyed by rating.
                        additionalProperties:
                          type: integer
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/reviews:
    post:
      tags: [Reviews]
      summary: Create a review for a delivered order item
      description: |
        Customer submits a review for a product they purchased. The order must belong to
        the caller, be DELIVERED, and include the product; only one review per
        (order, product, customer) is allowed. Accepts up to 5 image attachments
        (JPEG/PNG/WEBP/GIF, 5MB each) via multipart/form-data field "media".

        Rate limit: upload limiter (20 per minute per user).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [orderId, productId, rating]
              properties:
                orderId:
                  type: string
                productId:
                  type: string
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
                  minLength: 10
                  maxLength: 2000
                media:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Up to 5 image files, 5MB max each.
      responses:
        "201":
          description: Review created (status PENDING, pending platform moderation).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Review"
        "400":
          description: |
            Order not found, order not delivered, product not in order, duplicate review,
            invalid rating, or an invalid/oversized media file.
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/reviews/{reviewId}/helpful:
    post:
      tags: [Reviews]
      summary: Toggle "helpful" vote on a review
      description: |
        Marks (or, if already marked, unmarks) the review as helpful for the calling user.
        Only approved reviews can be voted on, and users cannot vote on their own review.
      parameters:
        - $ref: "#/components/parameters/reviewId"
      responses:
        "200":
          description: Updated review with adjusted helpfulCount.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Review"
        "400":
          description: Review not found, review not available (not approved), or cannot vote on your own review.
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/reviews/seller:
    get:
      tags: [Reviews]
      summary: List reviews for the seller's products
      description: "Required seller role: owner, manager, or staff."
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ReviewStatus"
          description: Filter by moderation status.
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: Seller's product reviews.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Review"
                  meta:
                    type: object
                    description: Pagination metadata.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/reviews/{reviewId}/reply:
    patch:
      tags: [Reviews]
      summary: Reply to a review
      description: |
        Adds the seller's public reply to an approved review on one of their products.
        Only one reply is allowed per review.

        Required seller role: owner or manager.
      parameters:
        - $ref: "#/components/parameters/reviewId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reply]
              properties:
                reply:
                  type: string
                  minLength: 5
                  maxLength: 1000
      responses:
        "200":
          description: Review with the seller's reply attached.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Review"
        "400":
          description: Review not found, review not approved, or already replied to.
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/reviews/pending:
    get:
      tags: [Reviews]
      summary: List reviews pending moderation
      description: "Required platform role: super_admin or product_reviewer."
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: Reviews awaiting moderation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Review"
                        - type: object
                          properties:
                            product:
                              type: object
                              properties:
                                id:
                                  type: string
                                name:
                                  type: string
                  meta:
                    type: object
                    description: Pagination metadata.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/reviews/{reviewId}/moderate:
    patch:
      tags: [Reviews]
      summary: Approve or reject a pending review
      description: "Required platform role: super_admin or product_reviewer."
      parameters:
        - $ref: "#/components/parameters/reviewId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [APPROVED, REJECTED]
      responses:
        "200":
          description: Moderated review.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Review"
        "400":
          description: Review not found or already moderated.
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---- Security ----
  /api/security/summary:
    get:
      tags: [Security]
      summary: Get account security summary
      description: Returns 2FA status, password last-changed date, last login, last active device, and active session count for the authenticated user.
      responses:
        "200":
          description: Security summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      twoFactorEnabled:
                        type: boolean
                      passwordLastChanged:
                        type: string
                        format: date-time
                        nullable: true
                      lastLogin:
                        type: string
                        format: date-time
                        nullable: true
                      lastActiveDevice:
                        type: string
                        nullable: true
                      activeSessionCount:
                        type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/security/2fa/setup:
    post:
      tags: [Security]
      summary: Begin two-factor authentication setup
      description: |
        Generates a new TOTP secret and QR code for the authenticated user to scan into
        an authenticator app. If 2FA is already enabled, a valid currentToken must be
        supplied to re-enroll (issue a new secret). The new secret is stored but 2FA is
        not enabled until confirmed via POST /api/security/2fa/verify.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                currentToken:
                  type: string
                  minLength: 6
                  maxLength: 6
                  description: Required only when re-enrolling a user who already has 2FA enabled.
      responses:
        "200":
          description: TOTP secret and QR code generated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      qrCodeDataUrl:
                        type: string
                        description: Data URL (PNG) of the TOTP enrollment QR code.
                      secret:
                        type: string
                        description: Base32 TOTP secret (also encoded in the QR code).
        "400":
          description: Current 2FA code required to re-enroll, or the supplied current code is invalid.
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/security/2fa/verify:
    post:
      tags: [Security]
      summary: Confirm setup and enable two-factor authentication
      description: |
        Verifies a TOTP code against the pending secret from /2fa/setup and, if valid,
        enables 2FA on the account.

        Rate limit: 2FA limiter (5 per minute per user).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 6
                  maxLength: 6
      responses:
        "200":
          description: Two-factor authentication enabled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      twoFactorEnabled:
                        type: boolean
                        example: true
        "400":
          description: 2FA setup not initiated, or the supplied code is invalid.
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/security/2fa/disable:
    post:
      tags: [Security]
      summary: Disable two-factor authentication
      description: |
        Verifies a TOTP code and, if valid, disables 2FA and clears the stored secret.

        Rate limit: 2FA limiter (5 per minute per user).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 6
                  maxLength: 6
      responses:
        "200":
          description: Two-factor authentication disabled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      twoFactorEnabled:
                        type: boolean
                        example: false
        "400":
          description: Invalid 2FA code.
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/security/sessions:
    get:
      tags: [Security]
      summary: List active sessions
      description: Returns all non-revoked login sessions for the authenticated user, most recently active first.
      responses:
        "200":
          description: Active sessions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/security/sessions/{sessionId}:
    delete:
      tags: [Security]
      summary: Revoke a session
      description: |
        Revokes the given session (must belong to the caller) and blacklists any access
        token issued for it for the remainder of its natural TTL.
      parameters:
        - $ref: "#/components/parameters/sessionId"
      responses:
        "200":
          description: Session revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/security/sessions/revoke-all:
    post:
      tags: [Security]
      summary: Revoke all other sessions
      description: |
        Revokes all of the authenticated user's non-revoked sessions except the one tied
        to the current request (when identifiable from the auth context), and blacklists
        their access tokens. Takes no request body.
      responses:
        "200":
          description: Bulk revoke result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      count:
                        type: integer
                        description: Number of sessions revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

