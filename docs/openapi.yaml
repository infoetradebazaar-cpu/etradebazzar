  # ---- Verification ----
  # NOTE: NOT CURRENTLY MOUNTED. src/modules/verification/verification.routes.ts exists but is never
  # imported/registered in src/app.ts (every other module is wired up there via
  # `app.use("/api/v1/<prefix>", ...Routes)` - there is no such line for verification). The paths
  # below are dead code in the running app until that registration is added. Documented here for
  # completeness based on the module's own internal routing structure and naming convention.
  /api/verification/aadhaar/generate-otp:
    post:
      tags: [Verification]
      summary: Request an Aadhaar OTP for seller KYC
      description: |
        WARNING - NOT CURRENTLY MOUNTED: this module's router is not registered in src/app.ts as
        of this writing - this endpoint is unreachable until it is wired up.

        Required seller role: owner.

        Requires an existing SellerKyc record (created during KYC submission). Generates an OTP
        against the Aadhaar verification provider and stores the provider's session client ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aadhaarNumber]
              properties:
                aadhaarNumber:
                  type: string
                  pattern: "^\\d{12}$"
                  example: "123456789012"
      responses:
        "200":
          description: OTP sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      otpSent:
                        type: boolean
                        example: true
        "400":
          description: Invalid Aadhaar number, no KYC record, Aadhaar already verified, or provider error.
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/verification/aadhaar/verify-otp:
    post:
      tags: [Verification]
      summary: Confirm an Aadhaar OTP for seller KYC
      description: |
        WARNING - NOT CURRENTLY MOUNTED: this module's router is not registered in src/app.ts as
        of this writing - this endpoint is unreachable until it is wired up.

        Required seller role: owner.

        Submits the OTP to the Aadhaar verification provider against the pending session from
        generate-otp. On success, marks the KYC record's Aadhaar status VERIFIED and writes an
        audit log entry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp]
              properties:
                otp:
                  type: string
                  minLength: 4
                  maxLength: 8
      responses:
        "200":
          description: Aadhaar verified. Updated KYC record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    description: The updated SellerKyc record, including aadhaarStatus=VERIFIED.
        "400":
          description: No KYC record, no pending OTP request, or OTP verification failed.
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/verification/government-id:
    post:
      tags: [Verification]
      summary: Submit a government ID for seller KYC
      description: |
        WARNING - NOT CURRENTLY MOUNTED: this module's router is not registered in src/app.ts as
        of this writing - this endpoint is unreachable until it is wired up.

        Required seller role: owner.

        Requires an existing SellerKyc record. For govtIdType=PAN, the number is validated and
        checked synchronously against the PAN verification provider, immediately setting status to
        VERIFIED or REJECTED. Other ID types are stored as PENDING for manual platform admin review.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [govtIdType, govtIdNumber]
              properties:
                govtIdType:
                  type: string
                  enum: [PAN, PASSPORT, VOTER_ID, DRIVING_LICENSE]
                govtIdNumber:
                  type: string
                  minLength: 4
                  maxLength: 30
                  example: ABCDE1234F
      responses:
        "200":
          description: Updated KYC record with the new government ID status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    description: The updated SellerKyc record.
        "400":
          description: No KYC record, government ID already verified, or invalid PAN format.
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

